    <script>
        // FLASHCARD DATA
        const flashcards = [
            {
                front: "Three adrenal cortex zones + products + mnemonic",
                back: "<strong>GFR = Salt/Sugar/Sex</strong><br><strong>Glomerulosa:</strong> aldosterone (salt)<br><strong>Fasciculata:</strong> cortisol (sugar)<br><strong>Reticularis:</strong> androgens (sex)"
            },
            {
                front: "Complete steroid synthesis pathway (Cholesterol → Pregnenolone)",
                back: "Cholesterol → <span class='enzyme'>CYP11A1/desmolase</span> (mitochondria, rate-limiting) → Pregnenolone"
            },
            {
                front: "Cortisol synthesis branch (complete pathway)",
                back: "Pregnenolone → <span class='enzyme'>3β-HSD</span> → Progesterone → <span class='enzyme'>17α-OH</span> → 17-OHP → <span class='enzyme'>21-OH</span> → 11-deoxycortisol → <span class='enzyme'>11β-OH</span> → <strong>Cortisol</strong>"
            },
            {
                front: "Aldosterone synthesis branch (complete pathway)",
                back: "Progesterone → <span class='enzyme'>21-OH</span> → 11-deoxycorticosterone (DOC) → <span class='enzyme'>11β-OH</span> → Corticosterone → <span class='enzyme'>CYP11B2 (aldosterone synthase)</span> [only in glomerulosa] → <strong>Aldosterone</strong>"
            },
            {
                front: "Androgen branch synthesis (DHEA to Testosterone)",
                back: "Pregnenolone → <span class='enzyme'>17α-OH</span> → 17-OH-pregnenolone → <span class='enzyme'>C17-20 lyase</span> → DHEA → <span class='enzyme'>3β-HSD</span> → Androstenedione → <span class='enzyme'>17β-HSD</span> → <strong>Testosterone</strong>"
            },
            {
                front: "Which enzyme is ABSENT in zona glomerulosa? Which enzyme is ONLY in glomerulosa?",
                back: "<strong>ABSENT:</strong> 17α-hydroxylase (explains why glomerulosa can't make cortisol or androgens)<br><strong>ONLY in glomerulosa:</strong> CYP11B2 (aldosterone synthase)"
            },
            {
                front: "21-hydroxylase deficiency (CAH) - clinical findings",
                back: "<strong>Substrate accumulates:</strong> 17-OHP (diagnostic marker)<br><strong>Results:</strong> ↓cortisol, ↓aldosterone (salt-wasting), ↑ACTH, ↑androgens (virilization), ↑renin"
            },
            {
                front: "11β-hydroxylase deficiency (CAH) - clinical findings",
                back: "<strong>Substrate accumulates:</strong> DOC (has mineralocorticoid activity)<br><strong>Results:</strong> ↓cortisol, ↑androgens (virilization), ↑ACTH<br><strong>KEY:</strong> HTN (not hypotension) due to DOC sodium retention"
            },
            {
                front: "17α-hydroxylase deficiency (CAH) - clinical findings",
                back: "<strong>Results:</strong> ↓cortisol, ↓androgens (↓all sex steroids), ↑aldosterone → HTN<br><strong>Phenotype:</strong> XX and XY both show absent/reduced sexual development; XY = female external genitalia (no androgens)"
            },
            {
                front: "11β-HSD type 2 in kidney - function and mechanism",
                back: "<strong>Function:</strong> Inactivates cortisol → cortisone<br><strong>Why important:</strong> Prevents cortisol from activating mineralocorticoid receptors (MR); only aldosterone can access MR<br><strong>Clinical:</strong> Licorice inhibits 11β-HSD2 → apparent mineralocorticoid excess (AME) syndrome"
            },
            {
                front: "Why can aldosterone activate MR but cortisol normally cannot?",
                back: "<strong>In kidney:</strong> 11β-HSD2 rapidly inactivates cortisol → cortisone (inactive)<br><strong>Aldosterone:</strong> NOT a substrate for 11β-HSD2, so it reaches MR in collecting duct<br><strong>Result:</strong> Only aldosterone can act as mineralocorticoid despite cortisol's high concentration"
            },
            {
                front: "HPA axis regulation - complete pathway",
                back: "<strong>CRH</strong> (hypothalamus) → <strong>ACTH</strong> (anterior pituitary via MC2R → Gs → cAMP) → <strong>Cortisol</strong> (adrenal fasciculata)<br><strong>Negative feedback:</strong> Cortisol inhibits CRH and ACTH release<br><strong>Stress:</strong> Overrides feedback → sustained cortisol release"
            },
            {
                front: "Cortisol circadian rhythm - pattern and mechanism",
                back: "<strong>Pattern:</strong> Peak at 8 AM (waking), trough at midnight<br><strong>Driver:</strong> Suprachiasmatic nucleus (SCN) circadian clock<br><strong>Disruption:</strong> Loss of diurnal variation is seen in Cushing's syndrome"
            },
            {
                front: "Adrenal androgens - types and clinical significance",
                back: "<strong>Main adrenal androgens:</strong> DHEA, DHEA-S (sulfate form, most abundant circulating), androstenedione<br><strong>Activity:</strong> Weak; converted peripherally to testosterone and estrogen<br><strong>Clinical importance:</strong> Responsible for pubic/axillary hair development and female libido<br><strong>Regulation:</strong> ACTH-driven"
            },
            {
                front: "Cortisol biological effects - metabolism and immune",
                back: "<strong>Metabolic:</strong> ↑gluconeogenesis, ↑glycogenolysis, ↑proteolysis, ↑lipolysis (peripheral), ↑blood glucose<br><strong>Anti-inflammatory:</strong> ↓PLA2, ↓COX, ↓NF-κB<br><strong>Immunosuppressive:</strong> ↓lymphocyte proliferation<br><strong>Other:</strong> ↑BP (upregulates α1 receptors), bone loss, poor wound healing, striae"
            },
            {
                front: "Aldosterone effects - mechanism in collecting duct",
                back: "<strong>Target:</strong> Principal cells of collecting duct<br><strong>Effects:</strong> ↑Na⁺ reabsorption (via ENaC and Na/K-ATPase), ↑K⁺ excretion, ↑H⁺ excretion<br><strong>Result:</strong> Metabolic alkalosis<br><strong>Regulation:</strong> Primarily by RAAS (angiotensin II) and serum K⁺, NOT primarily by ACTH"
            },
            {
                front: "Cushing's syndrome vs Cushing's disease - distinction",
                back: "<strong>Cushing's syndrome:</strong> Any cause of excess cortisol (pituitary, adrenal, ectopic, exogenous)<br><strong>Cushing's disease:</strong> Specifically pituitary ACTH-secreting adenoma causing bilateral adrenal hyperplasia"
            },
            {
                front: "Primary vs Secondary vs Tertiary adrenal insufficiency",
                back: "<strong>Primary (Addison):</strong> Adrenal gland failure → ↓cortisol + ↓aldosterone + ↑ACTH + hyperpigmentation<br><strong>Secondary:</strong> Pituitary ACTH deficiency → ↓cortisol, normal aldosterone (RAAS intact), NO hyperpigmentation<br><strong>Tertiary:</strong> Hypothalamic CRH deficiency → ↓cortisol, normal aldosterone, NO hyperpigmentation"
            },
            {
                front: "Addison's disease - pathophysiology and clinical features",
                back: "<strong>Causes:</strong> Adrenal autoimmunity (anti-21-OH antibodies) or infection (TB, fungi)<br><strong>Labs:</strong> ↓cortisol + ↓aldosterone + ↑ACTH + ↑renin<br><strong>Findings:</strong> Weakness, hypotension, hyponatremia, hyperkalemia, hyperpigmentation (↑ACTH → ↑MSH), hypoglycemia, salt craving"
            },
            {
                front: "Primary hyperaldosteronism (Conn's syndrome) - diagnosis",
                back: "<strong>Cause:</strong> Aldosterone-secreting adrenal adenoma or bilateral hyperplasia<br><strong>Result:</strong> ↑aldosterone → ↑Na⁺ retention → HTN + ↓renin (suppressed) + hypokalemia + metabolic alkalosis<br><strong>Key diagnostic feature:</strong> HIGH aldosterone WITH SUPPRESSED renin (distinguishes from secondary)"
            }
        ];

        // MCQ DATA
        const mcqs = [
            {
                question: "17α-hydroxylase is absent in which adrenal zone?",
                options: ["Glomerulosa", "Fasciculata", "Reticularis", "Capsule"],
                correct: 0,
                explanations: [
                    "CORRECT: Zona glomerulosa lacks 17α-hydroxylase, which is why it cannot produce cortisol or androgens—only mineralocorticoids (aldosterone).",
                    "Incorrect: Fasciculata has 17α-hydroxylase for cortisol synthesis.",
                    "Incorrect: Reticularis has 17α-hydroxylase for androgen synthesis.",
                    "Incorrect: Capsule is not a functional endocrine zone."
                ]
            },
            {
                question: "In 21-hydroxylase deficiency, which substrate accumulates?",
                options: ["17-OHP (17-hydroxyprogesterone)", "11-deoxycortisol", "DOC (11-deoxycorticosterone)", "Aldosterone"],
                correct: 0,
                explanations: [
                    "CORRECT: 17-OHP is the diagnostic marker that accumulates proximal to the 21-OH enzyme block. Elevated 17-OHP confirms CAH diagnosis.",
                    "Incorrect: 11-deoxycortisol accumulates in 11β-OH deficiency, not 21-OH deficiency.",
                    "Incorrect: DOC accumulates in 11β-OH deficiency (mineralocorticoid → HTN).",
                    "Incorrect: Aldosterone is downstream and typically low in 21-OH deficiency."
                ]
            },
            {
                question: "Licorice ingestion causes HTN and hypokalemia. What is the mechanism?",
                options: ["Direct aldosterone release", "Inhibits 11β-HSD2 → cortisol acts on MR → apparent mineralocorticoid excess", "Blocks ACE inhibitor pathway", "Increases ACTH production"],
                correct: 1,
                explanations: [
                    "Incorrect: Licorice does not directly trigger aldosterone secretion.",
                    "CORRECT: Licorice inhibits 11β-HSD2 in kidney, preventing cortisol inactivation. Cortisol then binds MR (normally protected by 11β-HSD2), causing sodium retention and hypokalemia—mimicking primary hyperaldosteronism (apparent mineralocorticoid excess).",
                    "Incorrect: Licorice does not block ACE inhibitors.",
                    "Incorrect: Licorice does not directly increase ACTH."
                ]
            },
            {
                question: "ACTH stimulates the adrenal cortex via which receptor/pathway?",
                options: ["MC4R → Gi → ↓cAMP", "MC2R → Gs → ↑cAMP → PKA → StAR protein mobilization", "MR activation", "CRH receptor signaling"],
                correct: 1,
                explanations: [
                    "Incorrect: MC4R (melanocortin 4 receptor) is involved in appetite regulation, not adrenal steroidogenesis.",
                    "CORRECT: MC2R (ACTH receptor) is Gs-coupled, activating adenylyl cyclase → ↑cAMP → PKA activation → phosphorylation of StAR protein → cholesterol transport into mitochondria for CYP11A1 action.",
                    "Incorrect: MR (mineralocorticoid receptor) responds to aldosterone, not ACTH.",
                    "Incorrect: CRH acts on corticotroph cells in the pituitary, not directly on adrenal tissue."
                ]
            },
            {
                question: "A patient has HTN, hypokalemia, elevated aldosterone with SUPPRESSED renin. Diagnosis?",
                options: ["Secondary hyperaldosteronism", "Primary hyperaldosteronism (Conn's syndrome)", "Renovascular HTN", "ACE inhibitor overuse"],
                correct: 1,
                explanations: [
                    "Incorrect: Secondary hyperaldosteronism (from RAAS activation) shows elevated renin and aldosterone together.",
                    "CORRECT: Primary hyperaldosteronism (adrenal adenoma or hyperplasia) autonomously produces aldosterone, suppressing renin via negative feedback. High aldosterone + low renin is the classic diagnostic pattern.",
                    "Incorrect: Renovascular HTN activates RAAS, elevating both renin and aldosterone.",
                    "Incorrect: ACE inhibitors block angiotensin II, lowering aldosterone, not elevating it."
                ]
            },
            {
                question: "What distinguishes 11β-OH deficiency from 21-OH deficiency regarding blood pressure?",
                options: ["11β-OH causes hypotension; 21-OH causes HTN", "11β-OH causes HTN due to DOC accumulation; 21-OH causes hypotension due to aldosterone loss", "Both cause HTN equally", "Both cause hypotension equally"],
                correct: 1,
                explanations: [
                    "Incorrect: This is reversed.",
                    "CORRECT: In 11β-OH deficiency, DOC (11-deoxycorticosterone) accumulates upstream and has mineralocorticoid activity → sodium retention → HTN. In 21-OH deficiency, aldosterone production is blocked → salt-wasting → hypotension and hyponatremia.",
                    "Incorrect: The blood pressure effects differ significantly.",
                    "Incorrect: The blood pressure effects differ significantly."
                ]
            },
            {
                question: "Cortisol's anti-inflammatory effect is mediated primarily by which mechanism?",
                options: ["Direct TNF-α neutralization", "↓PLA2 via annexin-1/lipocortin → ↓arachidonic acid → ↓PGs/LTs/PAF; also ↓NF-κB → ↓cytokine transcription", "Blocking T-cell activation alone", "Increasing IL-10 production only"],
                correct: 1,
                explanations: [
                    "Incorrect: Cortisol does not directly bind TNF-α.",
                    "CORRECT: Glucocorticoids induce annexin-1 (lipocortin), which inhibits phospholipase A2 → reduced arachidonic acid release → decreased prostaglandin, leukotriene, and PAF synthesis. Additionally, cortisol inhibits NF-κB → reduced pro-inflammatory cytokine transcription.",
                    "Incorrect: While cortisol does suppress T-cell proliferation, this is not the primary anti-inflammatory mechanism.",
                    "Incorrect: IL-10 upregulation is one mechanism, but not the primary one."
                ]
            },
            {
                question: "In Addison's disease, what causes hyperpigmentation?",
                options: ["Melanoma development", "↑ACTH has MSH-like activity at melanocortin receptors in skin → ↑melanin synthesis", "Deposition of iron in skin", "Increased estrogen levels"],
                correct: 1,
                explanations: [
                    "Incorrect: Addison's disease does not cause melanoma.",
                    "CORRECT: In primary adrenal insufficiency, ↓cortisol removes negative feedback on the pituitary → ↑ACTH. ACTH and related peptides (derived from POMC) have melanocyte-stimulating hormone (MSH) activity at melanocortin-1 receptors (MC1R) on melanocytes → increased melanin production, causing characteristic darkening of skin, especially in sun-exposed areas and skin creases.",
                    "Incorrect: Iron is not involved in Addison's hyperpigmentation.",
                    "Incorrect: Estrogen is not the mechanism."
                ]
            },
            {
                question: "Which adrenal hormone is regulated by angiotensin II and serum K+, but NOT significantly by ACTH?",
                options: ["Cortisol", "DHEA", "Aldosterone", "Androstenedione"],
                correct: 2,
                explanations: [
                    "Incorrect: Cortisol is primarily regulated by ACTH.",
                    "Incorrect: DHEA is ACTH-regulated.",
                    "CORRECT: Aldosterone is primarily regulated by the renin-angiotensin-aldosterone system (RAAS—specifically angiotensin II) and serum potassium level. ACTH does NOT significantly regulate aldosterone secretion; this is a key distinguishing feature.",
                    "Incorrect: Androstenedione is ACTH-regulated (adrenal androgen)."
                ]
            },
            {
                question: "A patient on long-term prednisone stops abruptly. Why is this dangerous?",
                options: ["Prednisone causes adrenal cancer", "Exogenous glucocorticoids suppress HPA axis → adrenal atrophy → no endogenous cortisol production → adrenal crisis", "Prednisone has no effect on the HPA axis", "Abrupt discontinuation cures adrenal insufficiency"],
                correct: 1,
                explanations: [
                    "Incorrect: Prednisone does not cause cancer.",
                    "CORRECT: Chronic exogenous glucocorticoid administration suppresses CRH and ACTH via negative feedback → adrenal gland atrophy and decreased steroidogenic capacity. Abrupt cessation removes exogenous steroid without allowing adrenal recovery, resulting in acute cortisol deficiency → adrenal crisis with shock, hyponatremia, and hyperkalemia. Tapering is essential to allow HPA axis recovery.",
                    "Incorrect: Prednisone potently suppresses the HPA axis.",
                    "Incorrect: Abrupt discontinuation causes crisis, not cure."
                ]
            },
            {
                question: "What is the rate-limiting step in adrenal steroid synthesis?",
                options: ["3β-HSD action", "17α-hydroxylase action", "Cholesterol → pregnenolone via CYP11A1/cholesterol desmolase (controlled by StAR protein)", "21-hydroxylase action"],
                correct: 2,
                explanations: [
                    "Incorrect: 3β-HSD is active but not the rate-limiting step.",
                    "Incorrect: 17α-hydroxylase is downstream of the rate-limiting step.",
                    "CORRECT: The first and rate-limiting step is cholesterol transport into the mitochondrial matrix via StAR protein (steroidogenic acute regulatory protein), followed by CYP11A1 (P450 side-chain cleavage/desmolase) conversion to pregnenolone. ACTH increases StAR expression and phosphorylation, acutely increasing steroid synthesis.",

                ]
            },
            {
                question: "In CAH 17α-hydroxylase deficiency, why does blood pressure increase?",
                options: ["Cannot synthesize sex steroids or cortisol; ↑ACTH drives excess progesterone → DOC accumulation (mineralocorticoid) → Na+ retention → HTN", "Direct angiotensin II elevation", "Aldosterone is excessively produced", "Catecholamine overproduction"],

        function initFlashcards() {
            const container = document.getElementById('flashcard-container');

                cardDiv.className = 'card flashcard';

        function toggleFlashcard(element) {
            element.classList.toggle('flipped');
            const backContent = element.querySelector('.back-content');
            if (element.classList.contains('flipped')) {
                element.querySelector('.flashcard-content').innerHTML = backContent.innerHTML;
            } else {
                element.querySelector('.flashcard-content').innerHTML = backContent.previousElementSibling.textContent;
            }
        }

        function resetFlashcards() {
            document.querySelectorAll('.flashcard').forEach(card => card.classList.remove('flipped'));
            initFlashcards();
        }

        function shuffleFlashcards() {
            const shuffled = [...flashcards].sort(() => Math.random() - 0.5);
            const container = document.getElementById('flashcard-container');
            container.innerHTML = '';
            shuffled.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card flashcard';

                cardDiv.innerHTML = `

                `;
                container.appendChild(cardDiv);
            });
        }

            const container = document.getElementById('mcq-container');

            mcqs.forEach((mcq, qIndex) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'card mc-question';

                mcq.options.forEach((option, optIndex) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'mc-option';
                    optDiv.innerHTML = option;
                    optDiv.onclick = () => selectOption(qIndex, optIndex, optDiv);
                    qDiv.appendChild(optDiv);
                });

                const expDiv = document.createElement('div');
                expDiv.className = 'explanation';
                expDiv.id = `exp-${qIndex}`;
                expDiv.innerHTML = '<div id="exp-content"></div>';
                qDiv.appendChild(expDiv);

                container.appendChild(qDiv);
            });
        }

        function selectOption(qIndex, optIndex, element) {
            const card = element.closest('.mc-question');
            const options = card.querySelectorAll('.mc-option');
            const exp = card.querySelector('.explanation');
            const expContent = exp.querySelector('#exp-content');

            options.forEach((opt, idx) => {
                opt.classList.remove('selected', 'correct', 'incorrect');
                if (idx === mcqs[qIndex].correct) {
                    opt.classList.add('correct');
                } else if (idx === optIndex && idx !== mcqs[qIndex].correct) {
                    opt.classList.add('incorrect');
                }
            });

            element.classList.add('selected');
            expContent.innerHTML = mcqs[qIndex].explanations[optIndex];
            exp.classList.add('show');

            updateMCQProgress();
        }

        function updateMCQProgress() {
            const answered = document.querySelectorAll('.mc-option.selected').length;
            document.getElementById('mcq-progress').textContent = `Progress: ${answered} / ${mcqs.length}`;
        }

        function resetMCQ() {
            document.querySelectorAll('.mc-option').forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect');
            });
            document.querySelectorAll('.explanation').forEach(exp => exp.classList.remove('show'));

        }
