    <script>
        const flashcards = [
            {q: "Graves disease — autoantibodies and mechanism", a: "TSI (thyroid-stimulating immunoglobulin) = IgG autoantibody that binds TSH receptor → constitutive Gs activation → cAMP → T3/T4 production without TSH. TSI is pathognomonic for Graves. Also: TPO antibodies (positive but non-specific — also in Hashimoto). TgAb (thyroglobulin antibodies) also present."},
            {q: "Graves ophthalmopathy — mechanism and features", a: "TSH receptor expressed on orbital fibroblasts → TSI cross-reacts → fibroblast activation → ↑glycosaminoglycan (hyaluronan) production → orbital edema + expansion of extraocular muscles. Features: proptosis (exophthalmos), periorbital edema, diplopia, corneal exposure → keratitis. Can worsen with radioiodine therapy. Treatment: selenium (mild), IV glucocorticoids (moderate), orbital radiation/surgery (severe). Smoking is major risk factor."},
            {q: "Hashimoto thyroiditis — mechanism and antibodies", a: "Autoimmune hypothyroidism: TH1 CD8+ T cells destroy thyroid follicular cells. Antibodies: TPO Ab (anti-thyroid peroxidase — most sensitive, >95%) and TgAb (anti-thyroglobulin). Lymphocytic infiltration + germinal center formation on biopsy (Hürthle cells). May have transient hyperthyroidism (hashitoxicosis) from follicle destruction → T4/T3 release."},
            {q: "Sick euthyroid syndrome (non-thyroidal illness syndrome) — lab pattern and mechanism", a: "Seen in critical illness, starvation, surgery. Labs: low T3 (↓5'-deiodinase → less T4→T3 conversion), normal-low T4, low/normal TSH. Mechanism: cytokines (IL-1, IL-6) → ↓TRH/TSH, ↓thyroid binding globulin, ↓5'-deiodinase. Purpose: conserve energy. Treatment: NONE — do NOT treat. TSH normalizes with recovery."},
            {q: "Iodine deficiency — thyroid adaptations", a: "Low iodine → ↓T4/T3 → ↑TSH → thyroid hyperplasia → goiter (diffuse). Chronic severe deficiency → hypothyroidism. In pregnancy: maternal T4 critical for fetal brain development → iodine deficiency in pregnancy → cretinism (intellectual disability, deafness, spastic diplegia, short stature). Most common preventable cause of intellectual disability worldwide."},
            {q: "Wolff-Chaikoff effect and escape", a: "Acute iodine load → ↓thyroid hormone synthesis (organification blocked — Wolff-Chaikoff effect). Normal thyroid: escapes within 2 weeks (↓NIS expression → less iodide uptake). Failing to escape → hypothyroidism (e.g., amiodarone, IV contrast in susceptible individuals). Used therapeutically: Lugol\'s iodine pre-thyroidectomy (reduces vascularity)."},
            {q: "Amiodarone — thyroid effects", a: "40% iodine by weight. Effects: (1) Hypothyroidism — Wolff-Chaikoff effect + inhibits 5\'-deiodinase (↓T4→T3) + direct toxic thyroiditis. (2) Hyperthyroidism Type 1: iodine load → ↑synthesis in autonomous nodule/Graves. Type 2: destructive thyroiditis → T4/T3 release. Distinguish: Type 1 → treated with MMI; Type 2 → treated with glucocorticoids. Both types: avoid RAI (iodine-saturated)."},
            {q: "Central hypothyroidism — diagnosis and treatment", a: "Pituitary (secondary) or hypothalamic (tertiary) — TSH is LOW or inappropriately normal (not elevated as in primary). Causes: pituitary adenoma, craniopharyngioma, Sheehan, radiation, infiltrative disease. Diagnosis: TRH stimulation test (↑TSH in tertiary/hypothalamic, blunted in pituitary). Treatment: levothyroxine (same as primary) — but monitor free T4, NOT TSH."},
            {q: "Thyroid cancer — types and key features", a: "Papillary (most common, 80%): RET/PTC rearrangements, BRAF V600E; psammoma bodies, Orphan Annie eye nuclei, ground glass nuclei; excellent prognosis. Follicular: RAS mutation, PAX8-PPARγ; vascular/capsular invasion required for diagnosis. Medullary: RET point mutation (MEN2A/2B), calcitonin marker. Anaplastic: worst prognosis, p53 mutation. All except anaplastic: treated with surgery ± RAI."},
            {q: "TSH-secreting pituitary adenoma (TSHoma)", a: "Rare cause of hyperthyroidism. Features: elevated T4/T3, elevated (or inappropriately normal) TSH, pituitary adenoma on MRI. Distinguishes from Graves: no TSI, TSH is high (not suppressed). Treatment: transsphenoidal surgery. Somatostatin analogs (octreotide) reduce TSH secretion. Must not be confused with thyroid hormone resistance."},
            {q: "Thyroid hormone resistance (RTH)", a: "Usually caused by THRB (thyroid hormone receptor beta) mutation → pituitary and peripheral tissues resistant to T4/T3. Labs: high T4/T3, high-normal TSH (pituitary not suppressed). Symptoms: often minimal (peripheral tissues also resistant). Key: distinguish from TSHoma — RTH has no pituitary mass. Family history common (AD)."},
            {q: "Postpartum thyroiditis", a: "Autoimmune thyroiditis after delivery. Pattern: Phase 1 hyperthyroidism (1-4 months — follicle destruction → T4/T3 release) → Phase 2 hypothyroidism (4-8 months) → usually euthyroid (resolution). Most women recover; 20-30% develop permanent hypothyroidism. Anti-TPO Ab positive. RAI uptake low (destructive, not synthetic). Treatment: symptomatic (beta-blockers for hyper, levothyroxine for hypo)."},
            {q: "Subacute (de Quervain) thyroiditis", a: "Post-viral (usually URI, Coxsackie/mumps). Presentation: painful tender thyroid + fever + elevated ESR + jaw pain (distinctive). Pattern: same as postpartum (hyper → hypo → recovery). Labs: ↑ESR, ↑CRP, low RAI uptake. Treatment: NSAIDs (aspirin first), glucocorticoids if severe. Usually self-limiting."},
            {q: "Pendred syndrome", a: "Autosomal recessive SLC26A4 (pendrin) mutation → defective iodide-chloride transporter in thyroid and inner ear. Features: congenital sensorineural hearing loss + goiter ± hypothyroidism. Perchlorate discharge test: positive (defective organification). Most common syndromic form of congenital hearing loss."}
        ];

        const mcqs = [
            {stem: "A 35-year-old woman presents with palpitations, heat intolerance, weight loss, and proptosis. TSH is undetectable, T4 is elevated. Which antibody is pathognomonic for her diagnosis?", options: ["Anti-TPO antibody", "Anti-thyroglobulin antibody", "Thyroid-stimulating immunoglobulin (TSI)", "TSH receptor-blocking antibody", "Anti-microsomal antibody"], correct: 2, explanations: ["TPO Ab is positive in both Graves and Hashimoto (non-specific).", "TgAb is positive in both Graves and Hashimoto (non-specific).", "TSI (thyroid-stimulating immunoglobulin) is pathognomonic for Graves disease — it activates the TSH receptor constitutively, driving autonomous T4/T3 production. TSI is the distinguishing antibody and also drives ophthalmopathy.", "TSH receptor-blocking antibodies are seen in Graves disease but are not pathognomonic.", "Anti-microsomal antibodies are another name for anti-TPO (non-specific)."], teaching: "TSI (thyroid-stimulating immunoglobulin) is pathognomonic for Graves disease. TPO Ab and TgAb are positive in both Graves and Hashimoto, making them non-specific. TSI activates TSH receptor autonomously."},
            {stem: "A critically ill 70-year-old in the ICU has T3 of 40 ng/dL (low), T4 of 5 mcg/dL (low-normal), and TSH of 0.8 μIU/mL (low-normal). He has no prior thyroid disease. What is the most appropriate management?", options: ["Start levothyroxine immediately", "Start liothyronine (T3)", "Repeat thyroid function tests in 6 weeks after recovery", "Perform TRH stimulation test", "Check anti-TPO antibodies"], correct: 2, explanations: ["Levothyroxine is not indicated in sick euthyroid syndrome — treatment does not improve outcomes.", "Liothyronine (T3) is not indicated in sick euthyroid syndrome — it may be harmful.", "Sick euthyroid syndrome (non-thyroidal illness): T3 falls due to reduced 5'-deiodinase activity. TSH may be low/normal. This is an adaptive response to critical illness. Treatment does NOT improve outcomes and may be harmful. Management: treat the underlying illness and recheck TFTs after recovery.", "TRH stimulation test is not needed — the diagnosis is sick euthyroid based on clinical context.", "Anti-TPO testing is not relevant to sick euthyroid syndrome."], teaching: "Sick euthyroid syndrome is an adaptive response to critical illness. Do NOT treat with thyroid hormone — randomized trials show no benefit and possible harm. Manage the underlying condition."},
            {stem: "A 28-year-old woman on amiodarone develops hyperthyroidism. Ultrasound shows diffuse enlarged thyroid with increased vascularity. RAI uptake is normal. Which type of amiodarone-induced hyperthyroidism is this?", options: ["Type 2 — destructive thyroiditis", "Type 1 — iodine-excess autonomous synthesis", "Wolff-Chaikoff breakthrough", "Hashitoxicosis", "Postpartum thyroiditis"], correct: 1, explanations: ["Type 2 is destructive thyroiditis with low vascularity and low RAI uptake.", "Amiodarone-induced hyperthyroidism Type 1: iodine load → excess synthesis in autonomous tissue (nodule or underlying Graves). Features: goiter with increased vascularity, normal/increased RAI uptake. Treatment: thionamide (MMI/PTU). Type 2 is destructive (low RAI uptake, low vascularity, treated with glucocorticoids).", "Wolff-Chaikoff effect leads to hypothyroidism, not hyperthyroidism.", "Hashitoxicosis is seen in Hashimoto thyroiditis, not amiodarone-induced hyperthyroidism.", "Postpartum thyroiditis is a separate entity, not related to amiodarone."], teaching: "Amiodarone Type 1 (synthesis-driven): increased vascularity, normal/high RAI uptake, treat with MMI. Type 2 (destructive): low vascularity, low RAI uptake, treat with glucocorticoids."},
            {stem: "A patient with known pituitary adenoma is found to have low free T4 and TSH of 1.2 mIU/L (inappropriately normal). What is the diagnosis and how should response to levothyroxine treatment be monitored?", options: ["Primary hypothyroidism — monitor TSH", "Central hypothyroidism — monitor free T4", "Sick euthyroid — no treatment", "Thyroid hormone resistance — monitor T3", "Subclinical hypothyroidism — monitor TSH"], correct: 1, explanations: ["Primary hypothyroidism has elevated TSH, not inappropriately normal TSH.", "Central (secondary) hypothyroidism: pituitary cannot secrete normal TSH, so TSH is low or inappropriately normal despite low T4. After starting levothyroxine, TSH cannot be used to monitor (pituitary is broken). Monitor free T4 to target mid-normal range. This is the key monitoring difference from primary hypothyroidism.", "Sick euthyroid is not associated with pituitary adenoma.", "Thyroid hormone resistance would have high TSH and high T4 (not low T4).", "Subclinical hypothyroidism has elevated TSH with normal T4."], teaching: "Central hypothyroidism: monitor FREE T4 (not TSH) because the pituitary cannot generate appropriate TSH response. Target mid-normal free T4."},
            {stem: "A 55-year-old with a thyroid nodule undergoes FNA showing psammoma bodies and orphan Annie nuclei. What is the likely diagnosis and associated molecular marker?", options: ["Follicular thyroid cancer — RAS mutation", "Medullary thyroid cancer — calcitonin", "Papillary thyroid cancer — BRAF V600E or RET/PTC", "Anaplastic thyroid cancer — p53", "Hurthle cell carcinoma — mitochondrial DNA mutations"], correct: 2, explanations: ["Follicular cancer has RAS mutations and requires capsular/vascular invasion for diagnosis.", "Medullary cancer secretes calcitonin but does not have psammoma bodies.", "Papillary thyroid cancer: psammoma bodies (calcified concentric rings), Orphan Annie eye nuclei (ground glass, empty-appearing nuclei), nuclear grooves. Molecular: BRAF V600E (most common somatic mutation, ~60%) and RET/PTC rearrangements (especially radiation-induced). Best prognosis of all thyroid cancers.", "Anaplastic cancer has p53 mutations and worst prognosis.", "Hurthle cell carcinoma has mitochondrial mutations but not psammoma bodies."], teaching: "Papillary thyroid cancer has the BEST prognosis (>90% 10-year survival). Key features: psammoma bodies, Orphan Annie nuclei, BRAF V600E or RET/PTC mutations."},
            {stem: "A patient has elevated T4, elevated T3, and TSH of 4.2 mIU/L. MRI shows no pituitary abnormality. Family history of similar labs. What is the diagnosis?", options: ["Graves disease", "TSH-secreting pituitary adenoma (TSHoma)", "Thyroid hormone resistance (THRB mutation)", "Factitious hyperthyroidism", "Struma ovarii"], correct: 2, explanations: ["Graves disease has suppressed TSH, not elevated TSH.", "TSHoma would show pituitary adenoma on MRI.", "Thyroid hormone resistance: elevated T4/T3 + inappropriately high TSH + NO pituitary adenoma + family history = THRB mutation. Peripheral tissues are also resistant → minimal symptoms. Distinguished from TSHoma: no pituitary mass, family history, genetic testing (THRB mutation).", "Factitious hyperthyroidism would have suppressed TSH.", "Struma ovarii would present with Graves-like features, not thyroid hormone resistance."], teaching: "Thyroid hormone resistance (THRB mutation): high T4/T3 + high-normal TSH + no pituitary mass + family history. Distinguish from TSHoma by imaging and genetics."},
            {stem: "A pregnant woman in her first trimester is found to have TSH of 0.2 mIU/L (mildly suppressed) and normal free T4. She feels well. What is the most likely explanation?", options: ["Gestational hyperthyroidism from hCG stimulation", "Early Graves disease", "Subacute thyroiditis", "Postpartum thyroiditis", "TSH-secreting tumor"], correct: 0, explanations: ["hCG shares structural homology with TSH (both glycoprotein hormones with identical α-subunit). In first trimester, hCG peaks → stimulates TSH receptor → mild TSH suppression + ↑T4/T3. Gestational hyperthyroidism is physiological — usually no treatment needed. If severe (hyperemesis gravidarum, very high T4) → treat with PTU/MMI.", "Graves disease is possible but less likely given the normal T4 and lack of symptoms.", "Subacute thyroiditis presents with painful thyroid and fever.", "Postpartum thyroiditis occurs after delivery, not during pregnancy.", "TSH-secreting tumors are very rare."], teaching: "Gestational hyperthyroidism (first trimester): hCG structurally similar to TSH → mild TSH suppression is physiological. Usually no treatment needed unless severe."},
            {stem: "A patient with painful thyroid, fever, elevated ESR, and hyperthyroidism after a URI. RAI uptake is very low. What is the diagnosis and first-line treatment?", options: ["Graves disease — PTU", "Hashimoto thyroiditis — levothyroxine", "Subacute (de Quervain) thyroiditis — NSAIDs", "Toxic multinodular goiter — RAI ablation", "Amiodarone type 2 — glucocorticoids"], correct: 2, explanations: ["Graves disease does not follow a URI and has normal RAI uptake.", "Hashimoto thyroiditis is hypothyroid, not hyperthyroid.", "Subacute (de Quervain) thyroiditis: post-viral, painful tender thyroid, fever, elevated ESR, low RAI uptake (destructive — no active synthesis). Jaw pain is a distinctive feature. Hyperthyroidism is transient (follicle lysis). Treatment: NSAIDs (aspirin), glucocorticoids if severe. Self-limiting in most cases.", "Toxic multinodular goiter does not have low RAI uptake or fever.", "Amiodarone thyrotoxicosis is not preceded by URI."], teaching: "Subacute (de Quervain) thyroiditis: post-viral, painful thyroid, fever, elevated ESR, low RAI uptake (destructive). Treatment: NSAIDs first, glucocorticoids if severe."},
            {stem: "A neonate is born with sensorineural hearing loss and goiter. Perchlorate discharge test is positive. Thyroid hormone levels are low. What gene is mutated?", options: ["NIS (SLC5A5)", "Pendrin (SLC26A4)", "THRB", "DUOX2", "TPO"], correct: 1, explanations: ["NIS mutations cause iodide uptake defects.", "Pendred syndrome: SLC26A4 (pendrin) mutation — defective iodide-chloride exchanger in thyroid apical membrane and inner ear. Results in defective organification (iodide cannot enter colloid for incorporation into thyroglobulin) → goiter + hypothyroidism + congenital sensorineural deafness. Perchlorate discharge test positive (iodide not organified, washes out with perchlorate).", "THRB mutations cause thyroid hormone resistance.", "DUOX2 mutations affect oxidative stress generation in thyroiditis.", "TPO mutations affect peroxidase enzyme."], teaching: "Pendred syndrome: SLC26A4 (pendrin) mutation causes iodide-chloride transporter defect → defective organification → congenital deafness + goiter. Perchlorate discharge test is positive."}
        ];

        const vignettes = [
            {banner: "Graves Disease vs Hashimoto", stem: "A 32-year-old woman presents with 6 months of palpitations, heat intolerance, weight loss, and now bilateral eye protrusion. TSH undetectable, free T4 3x normal.", qa: [{q: "What antibody distinguishes Graves from Hashimoto?", a: "TSI (thyroid-stimulating immunoglobulin) — pathognomonic for Graves. TPO Ab is positive in both."}, {q: "What treatment options exist for Graves disease?", a: "Thionamides (methimazole first-line, PTU in first trimester/thyroid storm), radioiodine ablation (RAI), or surgery (thyroidectomy)."}, {q: "Her ophthalmopathy worsens after RAI. Why might this occur?", a: "RAI causes thyroid cell destruction → release of TSH receptor antigens → increased autoimmune response → worsening ophthalmopathy. Pre-treat with steroids in moderate-severe eye disease before RAI."}]},
            {banner: "Sick Euthyroid", stem: "A 65-year-old admitted to the ICU for pneumonia has TSH 0.5 (low-normal), T3 60 ng/dL (low), T4 5 mcg/dL (low-normal). No thyroid history.", qa: [{q: "What is the diagnosis?", a: "Sick euthyroid syndrome (non-thyroidal illness) — adaptive response to severe illness."}, {q: "What should NOT be done?", a: "Do not treat with thyroid hormone replacement — randomized trials show no benefit and possible harm."}, {q: "When should thyroid function tests be re-evaluated?", a: "6-8 weeks after recovery from acute illness — TFTs normalize with resolution of the underlying condition."}]},
            {banner: "Amiodarone Thyrotoxicosis", stem: "A 60-year-old on amiodarone for atrial fibrillation develops weight loss, AF worsening, and hyperthyroidism. Thyroid ultrasound: enlarged, hypervascular. RAI uptake: 25% (normal).", qa: [{q: "What type of amiodarone thyrotoxicosis is this?", a: "Type 1 — iodine-excess autonomous synthesis in pre-existing thyroid disease (nodule or Graves substrate). Evidence: increased vascularity, normal RAI uptake."}, {q: "How does this differ from Type 2?", a: "Type 2 is destructive thyroiditis — low vascularity, very low RAI uptake, treated with glucocorticoids not thionamides."}, {q: "Can amiodarone be stopped to treat this?", a: "Amiodarone has a half-life of 40-55 days — stopping has minimal immediate effect. Continue treating with MMI (Type 1) or glucocorticoids (Type 2). Amiodarone discontinuation for long-term management should be discussed with cardiology."}]},
            {banner: "Central Hypothyroidism", stem: "A 45-year-old 2 years post-pituitary radiation has low free T4 and TSH of 0.9 mIU/L.", qa: [{q: "What is the diagnosis?", a: "Central (secondary) hypothyroidism — pituitary damage → insufficient TSH secretion → inadequate thyroid stimulation → low T4."}, {q: "What is the key monitoring difference from primary hypothyroidism?", a: "Monitor free T4 (not TSH) — the pituitary cannot generate appropriate TSH response, so TSH is an unreliable guide to therapy."}, {q: "What other hormone deficiencies should be screened for?", a: "Full pituitary panel: GH, ACTH/cortisol, LH/FSH, prolactin — pituitary radiation affects all axes. Screen for central adrenal insufficiency before thyroid hormone (treating hypothyroid in AI patient can precipitate adrenal crisis)."}]},
            {banner: "Medullary Thyroid Cancer in MEN2A", stem: "A 28-year-old is referred after her brother was diagnosed with MEN2A. She undergoes genetic testing: RET C634F mutation confirmed.", qa: [{q: "What thyroid cancer is she at risk for?", a: "Medullary thyroid cancer (MTC) — arises from parafollicular C cells, secretes calcitonin. RET proto-oncogene mutation → constitutively active tyrosine kinase."}, {q: "What tumor marker is used to screen for and follow MTC?", a: "Serum calcitonin — secreted by C cells. CEA is also elevated. Calcitonin is the primary tumor marker."}, {q: "What is the recommended management given her mutation?", a: "Prophylactic thyroidectomy — timing depends on RET mutation risk level (ATA risk classification). C634F is high-risk — thyroidectomy recommended by age 5 or when calcitonin becomes detectable."}]}
        ];

        const traps = [
            {myth: "Anti-TPO antibodies are specific for Graves disease.", truth: "TPO Ab are positive in both Graves (~75%) and Hashimoto (>95%). TSI (thyroid-stimulating immunoglobulin) is the pathognomonic antibody for Graves disease.", correct: false},
            {myth: "Sick euthyroid syndrome should be treated with levothyroxine to improve outcomes.", truth: "Clinical trials show no benefit from thyroid hormone treatment in sick euthyroid syndrome. Treatment is to manage the underlying illness. TFTs normalize with recovery.", correct: false},
            {myth: "In central hypothyroidism, TSH monitoring is used to guide levothyroxine dosing.", truth: "The pituitary cannot produce normal TSH response in central hypothyroidism — TSH is unreliable. Monitor free T4, targeting the mid-normal range.", correct: false},
            {myth: "Amiodarone-induced hyperthyroidism Type 2 is treated with thionamides (PTU/MMI).", truth: "Type 2 is destructive thyroiditis (not synthesis-driven) → thionamides are ineffective. Treatment: glucocorticoids (prednisone 40-60 mg). Type 1 (excess synthesis) is treated with thionamides.", correct: false},
            {myth: "Papillary thyroid cancer has the worst prognosis of all thyroid cancers.", truth: "Papillary thyroid cancer has the best prognosis (10-year survival >90%). Anaplastic thyroid cancer has the worst prognosis (median survival <6 months).", correct: false},
            {myth: "Radioiodine therapy is safe for all patients with Graves disease and worsens ophthalmopathy in all cases.", truth: "RAI is effective for Graves disease but can worsen ophthalmopathy (especially in smokers and those with severe eye disease). Pre-treatment with glucocorticoids reduces this risk. RAI is relatively contraindicated in moderate-severe active ophthalmopathy.", correct: false},
            {myth: "hCG can suppress TSH during pregnancy due to structural homology with TSH.", truth: "hCG and TSH share the same α-subunit. hCG peaks in the first trimester → stimulates TSH receptor → suppresses TSH. This is gestational (physiological) hyperthyroidism — usually benign and self-limiting.", correct: true},
            {myth: "Iodine deficiency is the most common cause of intellectual disability worldwide that is preventable.", truth: "Iodine deficiency during pregnancy → inadequate maternal T4 → impaired fetal brain development → cretinism (intellectual disability, deafness, spastic diplegia). Universal salt iodization has dramatically reduced this.", correct: true},
            {myth: "Medullary thyroid cancer arises from follicular cells and secretes thyroglobulin.", truth: "Medullary thyroid cancer arises from parafollicular C cells (not follicular cells) → secretes calcitonin (not thyroglobulin). Calcitonin is the tumor marker used for screening and surveillance.", correct: false},
            {myth: "Subacute (de Quervain) thyroiditis has high RAI uptake during the hyperthyroid phase.", truth: "RAI uptake is very low in subacute thyroiditis — hyperthyroidism results from follicle destruction and T4/T3 release, NOT increased synthesis. Low RAI uptake distinguishes destructive thyroiditis from Graves disease.", correct: false}
        ];

        const fillInBlanks = [
            {prompt: "TSI (thyroid-stimulating immunoglobulin) activates the _____ receptor, leading to constitutive _____ production.", answer: "TSH receptor;TSHR;T3/T4;thyroid hormone"},
            {prompt: "Sick euthyroid syndrome shows low _____ due to reduced _____ activity converting T4 to T3.", answer: "T3;5'-deiodinase;deiodinase"},
            {prompt: "Amiodarone-induced hyperthyroidism Type 1 is treated with _____, while Type 2 is treated with _____.", answer: "MMI;methimazole;thionamides;glucocorticoids;prednisone;steroids"},
            {prompt: "Central hypothyroidism is monitored with _____ (not TSH) because the pituitary is _____.", answer: "free T4;dysfunctional;damaged;impaired"},
            {prompt: "Papillary thyroid cancer is associated with _____ mutation and shows _____ bodies on histology.", answer: "BRAF V600E;BRAF;RET/PTC;psammoma"},
            {prompt: "Medullary thyroid cancer is associated with _____ mutation and secretes _____ as its tumor marker.", answer: "RET;calcitonin"},
            {prompt: "The Wolff-Chaikoff effect is the transient _____ of thyroid hormone synthesis following acute _____ load.", answer: "inhibition;suppression;iodine;iodide"},
            {prompt: "Pendred syndrome involves mutation of _____ and presents with congenital _____ deafness and goiter.", answer: "SLC26A4;pendrin;sensorineural"}
        ];

        const refTable = [
            {lo: "Graves disease", step1: "TSI pathognomonic; Gs → cAMP autonomous production; ophthalmopathy mechanism", associations: "Exophthalmos, pretibial myxedema, thyroid acropachy", keywords: "TSI, TSH receptor, proptosis, smoking risk factor"},
            {lo: "Hashimoto thyroiditis", step1: "TPO Ab most sensitive; TH1 CD8 T cells; Hurthle cells", associations: "Most common hypothyroidism in developed world; associated with lymphoma", keywords: "Anti-TPO, hashitoxicosis, lymphocytic infiltration"},
            {lo: "Sick euthyroid", step1: "↓5'-deiodinase → low T3; adapt response; no treatment", associations: "ICU, critical illness, starvation", keywords: "Low T3, low/normal TSH, no treatment"},
            {lo: "Thyroid cancer types", step1: "Papillary (BRAF/RET) vs Follicular (RAS/PAX8) vs Medullary (RET/calcitonin) vs Anaplastic (p53)", associations: "Psammoma bodies, Orphan Annie nuclei (papillary); calcitonin (medullary)", keywords: "BRAF V600E, RET, calcitonin, p53"},
            {lo: "Central hypothyroidism", step1: "Low TSH + low T4; monitor free T4 not TSH; pituitary causes", associations: "Post-pituitary surgery/radiation, craniopharyngioma, Sheehan", keywords: "Free T4 monitoring, central AI first"},
            {lo: "Amiodarone thyroid effects", step1: "Type 1 (MMI) vs Type 2 (glucocorticoids); Wolff-Chaikoff; long half-life", associations: "40% iodine; inhibits 5'-deiodinase; both hypo and hyperthyroidism", keywords: "Amiodarone, Type 1 vs 2, low RAI uptake Type 2"},
            {lo: "Congenital hypothyroidism", step1: "Iodine deficiency → cretinism; Pendred syndrome (SLC26A4); newborn screening", associations: "Most preventable intellectual disability; Pendred = deafness + goiter", keywords: "Cretinism, iodine deficiency, pendrin, perchlorate test"}
        ];

        let ts = {c: 0, t: traps.length};

        function switchTab(n) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + n).classList.add('active');
            event.target.classList.add('active');
        }

        function renderFC() {
            const c = document.getElementById('fcGrid');
            c.innerHTML = '';
            flashcards.forEach((card, i) => {
                const el = document.createElement('div');
                el.className = 'fc';
                el.innerHTML = `<div class="fc-inner"><div class="fc-front"><div class="fc-label">Card ${i+1}</div><div class="fc-q">${card.q}</div><div class="fc-hint">Click to reveal</div></div><div class="fc-back"><div class="fc-label">Answer</div><div class="fc-a">${card.a}</div></div></div>`;
                el.onclick = () => el.classList.toggle('flipped');
                c.appendChild(el);
            });
        }

        function renderMCQ() {
            const c = document.getElementById('mcqCont');
            c.innerHTML = '';
            mcqs.forEach((q, i) => {
                const el = document.createElement('div');
                el.className = 'mcq-item';
                let opts = '';
                q.options.forEach((o, j) => {
                    opts += `<div class="mcq-opt" onclick="selOpt(this,${j===q.correct},\`${q.explanations[j].replace(/`/g,"'")}\`)"><span class="letter">${String.fromCharCode(65+j)}.</span><span>${o}</span></div>`;
                });
                el.innerHTML = `<div class="mcq-num">Question ${i+1}</div><div class="mcq-stem">${q.stem}</div><div class="mcq-options">${opts}</div><div class="mcq-exp"></div><div class="teaching"><div class="tp-label">Teaching Point</div><div>${q.teaching}</div></div>`;
                c.appendChild(el);
            });
        }

        function selOpt(el, ok, exp) {
            if (el.classList.contains('revealed')) return;
            const it = el.closest('.mcq-item');
            it.querySelectorAll('.mcq-opt').forEach(o => o.classList.add('revealed'));
            el.classList.add(ok ? 'correct' : 'wrong');
            const e = it.querySelector('.mcq-exp');
            e.innerHTML = `<div class="exp-label">${ok ? 'Correct!' : 'Incorrect'}</div><div>${exp}</div>`;
            e.classList.add('visible');
            it.querySelector('.teaching').classList.add('visible');
        }

        function renderVig() {
            const c = document.getElementById('vigCont');
            c.innerHTML = '';
            vignettes.forEach(v => {
                const el = document.createElement('div');
                el.className = 'vig-item';
                let qa = '';
                v.qa.forEach(x => {
                    qa += `<div><div class="vig-q">${x.q}</div><div class="vig-a">${x.a}</div></div>`;
                });
                el.innerHTML = `<div class="vig-banner">${v.banner}</div><div class="vig-stem">${v.stem}</div><button class="vig-btn" onclick="togVig(this)">Reveal Q&A</button><div class="vig-qa">${qa}</div>`;
                c.appendChild(el);
            });
        }

        function togVig(btn) {
            const q = btn.nextElementSibling;
            q.classList.toggle('visible');
            btn.textContent = q.classList.contains('visible') ? 'Hide Q&A' : 'Reveal Q&A';
        }

        function renderTraps() {
            const c = document.getElementById('trapCont');
            c.innerHTML = '';
            ts = {c: 0, t: traps.length};
            updTS();
            traps.forEach((t, i) => {
                const el = document.createElement('div');
                el.className = 'trap-item';
                el.innerHTML = `<div class="trap-stmt">${i+1}. ${t.myth}</div><div class="trap-btns"><button class="tbtn tbtn-c" onclick="ansT(${i},true)">CORRECT ✓</button><button class="tbtn tbtn-x" onclick="ansT(${i},false)">TRAP ✗</button></div><div class="trap-res" id="tr${i}"><div class="trap-verd" id="tv${i}"></div><div id="te${i}"></div></div>`;
                c.appendChild(el);
            });
        }

        function ansT(i, u) {
            const ok = (u === traps[i].correct);
            document.querySelectorAll(`[onclick*="ansT(${i},"]`).forEach(b => b.disabled = true);
            const r = document.getElementById('tr' + i);
            r.classList.add('show', ok ? 'ok' : 'bad');
            document.getElementById('tv' + i).innerHTML = ok ? '✓ Correct!' : '✗ Incorrect';
            document.getElementById('te' + i).innerHTML = traps[i].truth;
            if (ok) ts.c++;
            updTS();
        }

        function updTS() {
            const e = document.getElementById('tscore');
            if (e) e.textContent = `Score: ${ts.c}/${ts.t}`;
        }

        function renderFIB() {
            const c = document.getElementById('fibCont');
            c.innerHTML = '';
            fillInBlanks.forEach((q, i) => {
                const el = document.createElement('div');
                el.className = 'fib-item';
                el.innerHTML = `<div><strong>Q${i+1}:</strong> ${q.prompt}</div><input type="text" class="fib-in" placeholder="Type answer..." data-ans="${q.answer}"><button class="fib-btn" onclick="chkFib(this)">Check</button><div class="fib-res"></div>`;
                c.appendChild(el);
            });
        }

        function chkFib(btn) {
            const inp = btn.previousElementSibling;
            const ans = inp.getAttribute('data-ans').split(';').map(a => a.toLowerCase().trim());
            const u = inp.value.toLowerCase().trim();
            const r = btn.nextElementSibling;
            const ok = ans.some(a => u.includes(a) || a.includes(u));
            r.textContent = ok ? `✓ Correct! Answer: ${ans.join(' / ')}` : `✗ Incorrect. Answer: ${ans.join(' / ')}`;
            r.className = 'fib-res ' + (ok ? 'ok' : 'bad');
        }

        function renderRef() {
            const c = document.getElementById('refCont');
            let h = '<table class="ref-table"><thead><tr><th>GUSOM LO</th><th>Step 1 Extension</th><th>High-Yield Associations</th><th>Key Buzzwords</th></tr></thead><tbody>';
            refTable.forEach(r => {
                h += `<tr><td>${r.lo}</td><td>${r.step1}</td><td>${r.associations}</td><td class="hl">${r.keywords}</td></tr>`;
            });
            h += '</tbody></table>';
            c.innerHTML = h;
        }

        function fixCardHeights() {
            document.querySelectorAll('.fc').forEach(c => {
                const f = c.querySelector('.fc-front'), b = c.querySelector('.fc-back');
                const h = Math.max(f.scrollHeight, b.scrollHeight) + 16;
                c.style.minHeight = h + 'px';
                c.querySelector('.fc-inner').style.minHeight = h + 'px';
                f.style.minHeight = h + 'px';
                b.style.minHeight = h + 'px';
            });
        }

        window.onload = () => {
            renderFC();
            renderMCQ();
            renderVig();
            renderTraps();
            renderFIB();
            renderRef();
            setTimeout(fixCardHeights, 80);
        };
    </script>
</body>
</html>
