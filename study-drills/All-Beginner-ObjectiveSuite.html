<script>
const TLABELS={intro:'Intro: Hormone Action',hprel:'HP Relationships',post:'Posterior Pituitary',gh:'GH Axis',hpt:'HPT / Thyroid & Parathyroid',hpa:'HPA Axis',adsynth:'Adrenal Synthesis',adpath:'Adrenal Pathology',adpharm:'Adrenal Pharmacology',pitpath:'Pituitary Pathology',dm:'Diabetes'};

const CARDS=[
// ── INTRO TO HORMONE ACTION ──
{t:'intro',lo:'List the classes of hormones',q:'Name the 4 structural classes of hormones and give examples of each.',a:'1) Peptide/protein — insulin, GH, TSH, PTH, ADH. 2) Amino acid derivatives — catecholamines (epi, NE), thyroid hormones (iodinated tyrosines). 3) Steroids (from cholesterol) — cortisol, aldosterone, sex steroids, vitamin D. 4) Eicosanoids (from arachidonic acid) — prostaglandins, leukotrienes.'},
{t:'intro',lo:'Distinguish endocrine/paracrine/autocrine',q:'A cell releases a hormone that binds to receptors on the same cell. What mode of signaling is this?',a:'Autocrine signaling. Paracrine = acts on adjacent cells (short range). Endocrine = hormone enters bloodstream and acts at distant target. Juxtacrine = direct cell-to-cell contact.',trap:'Trap: students often confuse paracrine (nearby cell) and autocrine (same cell). Prostaglandins can be both.'},
{t:'intro',lo:'Contrast storage-vs-synthesis release',q:'Which classes of hormones are stored preformed and released on demand vs. synthesized continuously?',a:'Stored/released: peptide hormones (in secretory granules), catecholamines (in chromaffin granules). Synthesized and released immediately: steroid hormones (hydrophobic — cannot be stored) and thyroid hormones (unusual exception: stored as thyroglobulin in colloid outside the cell).',trap:'Trap: thyroid hormone is the "exception exception" — stored as thyroglobulin in colloid, NOT intracellularly like peptide granules.'},
{t:'intro',lo:'Nuclear receptor families',q:'What family of receptors do thyroid hormones, glucocorticoids, mineralocorticoids, estrogens, androgens, and vitamin D all share?',a:'The steroid/thyroid/retinoic acid superfamily of nuclear receptors. They share a common domain structure: ligand-binding domain + DNA-binding domain (zinc fingers). All modulate gene transcription. TR (thyroid receptor) is unique in binding DNA even without hormone — it represses transcription at TREs in the absence of T3.'},
{t:'intro',lo:'Membrane vs nuclear receptor',q:'TSH binds its receptor and causes a rapid rise in cAMP within seconds. Why is this faster than cortisol\'s effects?',a:'TSH binds a GPCR (Gs-coupled) on the cell membrane → rapid activation of adenylyl cyclase → cAMP surge in seconds. Cortisol enters the cell, binds nuclear receptor, translocates to nucleus, and modulates gene transcription — effects take hours. Membrane receptors allow amplified, rapid signaling; nuclear receptors produce slower, sustained genomic changes.'},
{t:'intro',lo:'Role of carrier proteins',q:'Cortisol circulates >90% protein-bound. Does this make it inactive? What is the clinical relevance?',a:'Protein-bound hormone is biologically inactive (cannot enter cells). Only free fraction is active. Clinical implication: total cortisol levels may be misleading if carrier proteins (CBG) are altered. Pregnancy/estrogen → ↑CBG → ↑total cortisol but normal free cortisol → patient is not hypercortisolemic despite elevated total cortisol.',trap:'Trap: elevated total cortisol in pregnancy is NOT Cushing\'s — measure free cortisol or 24hr urine cortisol.'},
// ── HP RELATIONSHIPS ──
{t:'hprel',lo:'Anatomic HP relationships',q:'What is the functional significance of the pituitary portal blood system?',a:'Hypothalamic releasing/inhibiting hormones are secreted into the primary capillary plexus in the median eminence → travel via portal veins to the anterior pituitary → act on specific pituitary cell types at very high concentrations. Blocking this portal flow → anterior pituitary hormones FALL (except prolactin, which RISES — because PIF/dopamine is inhibitory, and without it prolactin is released constitutively).',trap:'Trap: cutting portal blood flow increases prolactin (removes dopamine inhibition) but decreases all other anterior pituitary hormones.'},
{t:'hprel',lo:'List releasing/inhibiting hormones',q:'Match each hypothalamic hormone to its anterior pituitary target(s): TRH, CRH, GHRH, SS, GnRH, DA.',a:'TRH → TSH (+ prolactin). CRH → ACTH. GHRH → GH (stimulate). Somatostatin (SS) → GH + TSH (inhibit). GnRH → LH + FSH. Dopamine (DA) → Prolactin (inhibit). Note: GH has BOTH a releaser (GHRH) and inhibitor (SS) — unique dual regulation.'},
{t:'hprel',lo:'Three levels of feedback',q:'Distinguish long, short, and ultrashort feedback loops.',a:'Long loop: terminal hormone (e.g., cortisol, T3, IGF-1) inhibits hypothalamus AND pituitary. Short loop: pituitary hormone (e.g., ACTH) feeds back to inhibit hypothalamus. Ultrashort loop: hypothalamic hormone inhibits its own neurons via axon collaterals — sets pulsatile rhythm.',trap:'Trap: ultrashort loop is self-inhibition by the HYPOTHALAMIC hormone, not pituitary. Pulsatile GnRH is driven by ultrashort loop.'},
{t:'hprel',lo:'Predict ablation effects',q:'A patient has bilateral adrenalectomy. What happens to CRH and ACTH levels?',a:'Removing adrenal glands eliminates cortisol → loss of long-loop negative feedback → BOTH CRH (hypothalamus) and ACTH (pituitary) are markedly elevated. The increased ACTH stimulates POMC-derived peptides including MSH → hyperpigmentation (same mechanism as Addison\'s).',trap:'Trap: Addison\'s and post-adrenalectomy both cause skin darkening via ACTH/MSH — you cannot distinguish by skin pigmentation alone.'},
{t:'hprel',lo:'Anterior pituitary cell types',q:'Name the 5 anterior pituitary cell types and their hormones. Which is most abundant?',a:'Somatotrophs (GH, 50% of cells — most abundant). Corticotrophs (ACTH, ~15-20%). Thyrotrophs (TSH). Gonadotrophs (LH + FSH). Lactotrophs (Prolactin). Mnemonic: FLAT PiG.'},
{t:'hprel',lo:'Prolactin regulation',q:'Why is prolactin the only anterior pituitary hormone whose secretion INCREASES with pituitary stalk section?',a:'All other hormones require hypothalamic releasing hormones and fall when cut off. Prolactin is tonically inhibited by dopamine (PIF) from the hypothalamus. Cutting the stalk removes dopamine inhibition → prolactin rises. Clinically: any lesion compressing the stalk (even non-functional tumors) causes hyperprolactinemia.'},
// ── POSTERIOR PITUITARY ──
{t:'post',lo:'Name posterior pituitary hormones and functions',q:'Where are AVP and oxytocin synthesized? Where are they released?',a:'Synthesized in hypothalamic magnocellular neurons (supraoptic nucleus → AVP; paraventricular nucleus → AVP + OT). They travel down axons through the infundibular stalk → stored and released from the posterior pituitary. NOT synthesized in the posterior pituitary itself.'},
{t:'post',lo:'AVP receptor subtypes',q:'Describe the 3 AVP receptor subtypes, their locations, and second messenger systems.',a:'V1a (vascular smooth muscle, platelets, liver, brain) → Gq → IP3/DAG → vasoconstriction. V1b (corticotrophs of anterior pituitary) → Gq → potentiates CRH action on ACTH. V2 (renal collecting duct principal cells) → Gs → cAMP → AQP2 insertion → water reabsorption (antidiuretic effect).',trap:'Trap: V2 is Gs/cAMP (antidiuretic); V1a is Gq/IP3 (vasoconstriction). DDAVP is V2-selective (D-arginine substitution).'},
{t:'post',lo:'Osmoreceptor-AVP reflex',q:'What is the osmotic threshold for AVP secretion, and why is the threshold for thirst 5-10 mOsm/kg higher?',a:'AVP secretion begins at ~280 mOsm/kg. Thirst threshold is ~290 mOsm/kg. The delay is adaptive: AVP causes water retention first (kidney adjusts), and only if still hyperosmolar does the brain drive thirst (behavioral response). Prioritizes renal conservation before seeking fluid.'},
{t:'post',lo:'Central vs nephrogenic DI',q:'A patient has polyuria with very dilute urine. AVP is undetectable. After desmopressin injection, urine osmolality rises to 620 mOsm/kg. What type of DI?',a:'Central (neurogenic) DI — the hypothalamus/posterior pituitary fails to produce biologically active AVP. Kidney V2 receptors are intact → responds to exogenous DDAVP → urine concentrates. Treat with intranasal DDAVP.',trap:'Trap: in nephrogenic DI, giving DDAVP does NOT concentrate urine (kidney is unresponsive). In central DI, it works perfectly.'},
{t:'post',lo:'Gestational DI',q:'A pregnant woman at 28 weeks develops severe polyuria and polydipsia. AVP levels are low. DDAVP works. What is the mechanism?',a:'Gestational DI: placental trophoblasts secrete vasopressinase → degrades endogenous AVP. DDAVP is resistant to vasopressinase (deaminated) → effective treatment. Resolves after delivery.',trap:'Trap: gestational DI responds to DDAVP (vasopressinase-resistant) but not to natural AVP. Mechanism: enzyme destruction of AVP, not receptor defect.'},
{t:'post',lo:'Oropharyngeal receptors',q:'A dehydrated patient drinks ice-cold water. Before any change in plasma osmolality, they stop feeling thirsty and AVP secretion drops. Explain.',a:'Cold-sensitive oropharyngeal receptors are activated by cold water → afferent signals to hypothalamus → inhibit AVP secretion and thirst BEFORE osmolality actually changes. Anticipatory inhibition. Explains why drinking cold water gives faster relief than warm water.'},
{t:'post',lo:'Oxytocin in parturition',q:'Why are oxytocin receptor antagonists generally ineffective at stopping premature labor?',a:'Uterine oxytocin receptor expression dramatically upregulates at term (driven by estrogen). By the time active labor begins, receptor density is so high that the antagonist cannot effectively compete with even basal oxytocin levels. The high receptor density effectively "amplifies" the signal beyond what antagonism can overcome.',trap:'Trap: atosiban (OT antagonist) has limited efficacy in stopping premature labor — the issue is receptor upregulation, not drug potency.'},
{t:'post',lo:'OT/AVP second messengers in uterus vs breast',q:'Oxytocin causes milk ejection (breast) via IP3/Ca2+ and uterine contractions via IP3/Ca2+. Same receptor, same second messenger — why different clinical uses?',a:'Both uterine myometrium and mammary myoepithelial cells couple OT-R to Gq → IP3 → Ca2+ → contraction. Different cell types, same pathway, same result. The receptor is the SAME — it\'s the target tissue architecture that determines physiological outcome. OT is used clinically for: labor induction AND milk ejection/uterotonic postpartum.'},
// ── GH AXIS ──
{t:'gh',lo:'Identify GH hypothalamic hormones',q:'What two hypothalamic hormones regulate GH, and from which nuclei?',a:'GHRH (growth hormone-releasing hormone) from the arcuate nucleus → stimulates. Somatostatin (SS) from the periventricular nucleus → inhibits. Ghrelin (from stomach/hypothalamus) also stimulates GH.'},
{t:'gh',lo:'GH feedback types',q:'IGF-1 is produced by the liver in response to GH. Describe its feedback on the axis.',a:'Long-loop negative feedback: IGF-1 → inhibits GHRH from hypothalamus + stimulates somatostatin release. Also: GH itself provides short-loop feedback (GH → inhibits GHRH, stimulates SS). Result: IGF-1 is the best biochemical marker of chronic GH secretion (stable throughout day, unlike pulsatile GH).'},
{t:'gh',lo:'Physiological actions of GH',q:'GH has paradoxical effects on glucose — it promotes gluconeogenesis AND lipolysis. Why is this "diabetogenic"?',a:'GH directly causes insulin resistance in muscle and adipose (reduces glucose uptake). Simultaneously promotes lipolysis (↑FFA) and gluconeogenesis. Net effect: hyperglycemia + hyperlipidemia. Chronic GH excess (acromegaly) causes diabetes mellitus in 25-30% of patients.',trap:'Trap: GH is anabolic for protein synthesis (muscle/bone growth) but diabetogenic for glucose metabolism. Don\'t confuse overall anabolic effect with glucose effects.'},
{t:'gh',lo:'Stimulators and inhibitors of GH',q:'A diabetic patient with poor glucose control has unexpectedly HIGH GH. Why?',a:'Hypoglycemia stimulates GH release (low glucose = metabolic stress → GH to raise glucose via gluconeogenesis/lipolysis). In T1DM with recurrent hypoglycemia, GH is persistently elevated. Also: amino acids, exercise, sleep, estrogen stimulate GH. High glucose, FFA, hypercortisolemia, and obesity suppress GH.',trap:'Trap: obesity suppresses GH (elevated FFA). Hypoglycemia STIMULATES GH (important to remember for ITT provocative testing).'},
{t:'gh',lo:'Acromegaly features',q:'Why does acromegaly cause prognathism, increased hand/foot size, and coarse features in adults but NOT increased height?',a:'Growth plates close at puberty (epiphyseal fusion). After closure, GH excess cannot lengthen long bones → no height increase. Instead, GH/IGF-1 causes periosteal bone apposition + soft tissue growth → acral enlargement, jaw growth (prognathism), enlarged hands/feet, macroglossia. Gigantism = GH excess BEFORE growth plate closure.'},
{t:'gh',lo:'Micro vs macroadenoma',q:'What visual field defect occurs with a pituitary macroadenoma, and why?',a:'Bitemporal hemianopsia — the pituitary macroadenoma (≥1cm) expands superiorly and compresses the optic chiasm, where nasal retinal fibers (processing temporal visual fields) decussate. These fibers are damaged → both temporal visual fields are lost.',trap:'Trap: It is the NASAL retinal fibers that cross at the chiasm (processing temporal fields). Compression kills the crossing fibers → temporal vision loss bilaterally.'},
// ── HPT / THYROID ──
{t:'hpt',lo:'TH synthesis steps',q:'List in order the 6 steps of thyroid hormone synthesis. Which step does PTU inhibit uniquely?',a:'1) I⁻ uptake via NIS (Na/I symporter). 2) Oxidation of I⁻ by thyroperoxidase (TPO). 3) Organification: iodination of thyroglobulin tyrosines → MIT + DIT. 4) Coupling: MIT+DIT → T3; DIT+DIT → T4. 5) Endocytosis of thyroglobulin into follicular cell. 6) Proteolysis → hormone release. PTU uniquely inhibits step 6 peripheral T4→T3 conversion by deiodinase (methimazole does NOT do this).',trap:'Trap: PTU has 2 mechanisms (blocks TPO organification + blocks peripheral conversion). Methimazole only blocks organification/coupling. PTU preferred in thyroid storm and 1st trimester pregnancy.'},
{t:'hpt',lo:'Wolff-Chaikoff effect',q:'A patient receives a large iodine contrast load before CT imaging. What happens to thyroid hormone synthesis acutely, and why does it recover?',a:'Acute iodine excess → Wolff-Chaikoff effect: high intra-thyroid iodine transiently INHIBITS organification → brief ↓TH synthesis. "Escape" occurs in 1-2 weeks because NIS is downregulated → less iodine transported in → organification resumes. Clinical use: Lugol\'s iodine before thyroid surgery to reduce vascularity.',trap:'Trap: Wolff-Chaikoff causes HYPOTHYROIDISM, not hyperthyroidism, with acute iodine load. Escape prevents permanent hypothyroidism in normal individuals (but not in Hashimoto\'s patients — they may not escape).'},
{t:'hpt',lo:'T3 vs T4 receptor binding and transport',q:'T4 is the major secretory product of the thyroid, but T3 is the active hormone. Why?',a:'T4 is the prohormone — converted to T3 by 5\'-deiodinase in peripheral tissues (mainly liver, kidney). T3 binds thyroid receptor (TR) 10x more avidly than T4. TR is in the nucleus; T3 binding → conformational change → recruits coactivators → activates transcription at TREs. t½: T3 = 1.5 days, T4 = 6.5 days (T4 is storage form).',trap:'Trap: most thyroid hormone in blood is T4, but most ACTIVITY is T3. Measuring T4 in isolation can mislead.'},
{t:'hpt',lo:'TSH receptor mechanism and Graves',q:'How does Graves\' disease cause exophthalmos?',a:'TSI (thyroid-stimulating immunoglobulins) = IgG autoantibodies that bind and activate TSH receptors. TSH receptors are expressed not only on thyroid follicular cells but also on fibroblasts in the retroorbital space. TSI activation → fibroblast proliferation + glycosaminoglycan deposition → orbital enlargement → proptosis.',trap:'Trap: exophthalmos is NOT simply from hyperthyroidism — it is from direct autoimmune orbital disease. Treating hyperthyroidism (e.g., with I-131) does NOT reliably reverse or prevent exophthalmos.'},
{t:'hpt',lo:'Distinguish hypo vs hyperthyroid lab patterns',q:'A patient has TSH = 12 mIU/L (high), T4 = 3 µg/dL (low). Where is the primary defect?',a:'Primary hypothyroidism — the thyroid gland itself is failing (most commonly Hashimoto\'s in iodine-sufficient regions). Low T4 → no negative feedback → pituitary compensates with elevated TSH. If TSH were LOW with low T4 → secondary (pituitary) hypothyroidism.',trap:'Trap: always determine PRIMARY vs SECONDARY by TSH direction. High TSH = gland problem. Low TSH = pituitary/hypothalamus problem (when TH levels are also low).'},
{t:'hpt',lo:'Hashimoto vs Graves vs subacute thyroiditis',q:'Which autoantibodies distinguish Hashimoto\'s from Graves\'?',a:'Hashimoto\'s: anti-thyroglobulin + anti-TPO antibodies → T-cell mediated destruction → hypothyroidism. Graves\': TSI (thyroid-stimulating immunoglobulins) → activating TSH-R antibody → hyperthyroidism. Both can have both antibodies (70% Graves\' also have Tg/TPO antibodies). Subacute (de Quervain\'s) thyroiditis: post-viral, painful thyroid, transient hyperthyroid then hypothyroid, NO autoantibodies.',trap:'Trap: Hashimoto\'s may cause TRANSIENT hyperthyroidism early (hashitoxicosis — follicular destruction dumps preformed hormone) before becoming hypothyroid.'},
{t:'hpt',lo:'Thyroid cancer types',q:'A pathology report describes a thyroid tumor with "Orphan Annie eye nuclei," nuclear grooves, and psammoma bodies. What is the diagnosis and prognosis?',a:'Papillary thyroid carcinoma (PTC). Most common thyroid cancer (~80%). Spreads via lymphatics (cervical nodes). Nuclear features (Orphan Annie = ground-glass nuclei) are diagnostic. Psammoma bodies = concentrically layered calcifications. Excellent prognosis (10-yr survival >90%). Associated with RET/PTC and BRAF V600E mutations.',trap:'Trap: psammoma bodies are in PAPILLARY (not follicular) carcinoma. Follicular carcinoma is diagnosed by VASCULAR/CAPSULAR invasion, not nuclear features.'},
{t:'hpt',lo:'Primary vs secondary vs tertiary hyperparathyroidism',q:'Compare the PTH and calcium levels in primary, secondary, and tertiary hyperparathyroidism.',a:'Primary (adenoma/hyperplasia): ↑PTH, ↑Ca2+, ↓PO4. Secondary (CKD → vitamin D deficiency → low Ca → compensatory PTH): ↑PTH, low/normal Ca2+, ↑PO4. Tertiary (secondary HPT glands become autonomous): ↑PTH, ↑Ca2+ (glands no longer respond to Ca feedback). Treat secondary with vitamin D; treat tertiary with parathyroidectomy.',trap:'Trap: secondary HPT has HIGH PTH but LOW Ca (not elevated). Tertiary is when Ca becomes elevated — it has "escaped" feedback.'},
// ── HPA AXIS ──
{t:'hpa',lo:'HPA hormones and feedback',q:'What is the diurnal (circadian) pattern of cortisol secretion and what drives it?',a:'Cortisol peaks in early morning (6-8 AM) and troughs around midnight. Driven by circadian clock in the SCN (suprachiasmatic nucleus) acting on CRH release. Lowest cortisol at midnight is why the 1mg overnight dexamethasone suppression test is given at 11 PM — suppresses the morning peak in normal individuals.',trap:'Trap: midnight salivary cortisol is used to DETECT Cushing\'s (cortisol should be lowest then — elevated midnight cortisol = pathological).'},
{t:'hpa',lo:'Stimulators and inhibitors of cortisol',q:'A patient undergoing major surgery has markedly elevated cortisol. Why?',a:'Physiologic stress (pain, hypotension, surgery, hypoglycemia, infection) activates the stress response: CRH and AVP are released from the hypothalamus → ACTH from pituitary → cortisol from adrenal cortex. Cortisol supports the stress response: ↑gluconeogenesis, ↑lipolysis, ↑cardiac contractility, anti-inflammatory effects. Perioperative stress dose steroids are needed for adrenal-insufficient patients.',},
{t:'hpa',lo:'Differential metabolic effects of cortisol (low vs high)',q:'A patient takes prednisone for years for rheumatoid arthritis. Which tissues will show muscle wasting, central obesity, and poor wound healing?',a:'Chronic hypercortisolemia: Muscle (peripheral) → protein catabolism → wasting, proximal myopathy. Adipose (central) → fat redistribution centrally (moon face, buffalo hump, truncal obesity) — cortisol causes lipolysis peripherally but paradoxically drives lipogenesis centrally. Skin/connective tissue → ↓fibroblast activity → poor wound healing, skin thinning, easy bruising. Liver → gluconeogenesis ↑. Low cortisol (physiological): maintains blood glucose during overnight fast via gluconeogenesis.',trap:'Trap: chronic cortisol causes CENTRAL obesity (fat moves centrally), not overall weight gain. Peripheral fat is actually lost.'},
{t:'hpa',lo:'Cushing\'s Disease vs Syndrome pathophysiology',q:'A dexamethasone suppression test: 8mg high-dose overnight → cortisol suppresses. What is the source?',a:'High-dose dexamethasone suppresses PITUITARY ACTH adenoma (Cushing\'s Disease) — the pituitary retains some feedback sensitivity. DOES NOT suppress: adrenal adenoma/carcinoma (ACTH-independent), ectopic ACTH (no dexamethasone receptor). Low-dose test: suppresses NORMAL HPA axis but not ANY cause of Cushing\'s.',trap:'Trap: HIGH dose dexa suppresses pituitary source (Cushing\'s Disease). LOW dose dexa suppresses NORMAL axis only. Neither test identifies the lesion itself — imaging is needed.'},
{t:'hpa',lo:'Addison\'s disease symptoms',q:'Name 4 clinical features of Addison\'s disease and link each to its hormonal deficit.',a:'1) Hyperpigmentation → ↑ACTH (POMC-derived MSH). 2) Hypotension/orthostasis → ↓aldosterone → ↑Na+ loss, volume depletion. 3) Hyponatremia + hyperkalemia → ↓aldosterone → can\'t exchange Na/K in collecting duct. 4) Hypoglycemia → ↓cortisol → impaired gluconeogenesis. Also: weakness, weight loss, salt craving.',},
{t:'hpa',lo:'CAH pathophysiology',q:'A newborn XY male has ambiguous genitalia. Serum 17-OH progesterone is very high. What enzyme is deficient?',a:'21-hydroxylase (CYP21A2). Blocks conversion of 17-OHP to 11-deoxycortisol (cortisol pathway) AND progesterone to DOC (aldosterone pathway). 17-OHP accumulates → shunted to androgen pathway → fetal virilization. XY males appear nearly normal at birth but may present with salt wasting (days 2-3 of life). XX females present with ambiguous genitalia.',trap:'Trap: XY males with 21-OHD can have NORMAL-appearing genitalia at birth (salt-wasting crisis days later is the first sign). XX females present with clitoromegaly/fusion.'},
// ── ADRENAL SYNTHESIS ──
{t:'adsynth',lo:'Zone-enzyme-product relationships',q:'Why can\'t the zona glomerulosa produce cortisol?',a:'Zona glomerulosa lacks 17α-hydroxylase (CYP17A1) — it cannot convert progesterone to 17-OH progesterone, which is required for cortisol synthesis. It also cannot produce sex steroids. The glomerulosa is the ONLY zone with aldosterone synthase (CYP11B2), which requires Ang II and K+ (NOT primarily ACTH).',trap:'Trap: ACTH stimulates cortisol (zona fasciculata), NOT aldosterone. Aldosterone is controlled primarily by the renin-angiotensin-Aldosterone system (RAAS) + serum K+.'},
{t:'adsynth',lo:'StAR protein function',q:'A newborn has absent steroid synthesis in all three adrenal zones. Which rate-limiting molecule is most likely deficient?',a:'StAR (Steroidogenic Acute Regulatory) protein — transports cholesterol from the outer to inner mitochondrial membrane (rate-limiting step for ALL steroid synthesis). Lipoid CAH = StAR deficiency → no steroid production in adrenal OR gonads. Presents with severe salt-wasting, glucocorticoid deficiency, and 46,XY sex reversal (female phenotype).'},
{t:'adsynth',lo:'11β-OHD vs 21-OHD comparison',q:'TRAP: Two newborns both have virilization and elevated androgens. Newborn A has hypertension and hypokalemia. Newborn B has hyponatremia and hyperkalemia. Which enzyme deficiency does each have?',a:'Newborn A = 11β-hydroxylase deficiency. DOC (a potent mineralocorticoid) accumulates → HTN + hypokalemia. No salt-wasting (excess mineralocorticoid). Newborn B = 21-hydroxylase deficiency. Both cortisol AND aldosterone are deficient → salt-wasting (low Na, high K). Both → androgen excess → virilization.',trap:'THE KEY DISTINCTION: 11β-OHD → HYPERTENSION. 21-OHD → SALT-WASTING. Both → virilization. 17-OHD → HTN + no sex steroids (XY female phenotype).'},
{t:'adsynth',lo:'Mineralocorticoid receptor selectivity',q:'Aldosterone and cortisol both bind the mineralocorticoid receptor with similar affinity. Why doesn\'t cortisol (present at much higher concentration) cause constant mineralocorticoid effects?',a:'11β-HSD2 (11β-hydroxysteroid dehydrogenase type 2) is expressed in aldosterone target tissues (renal collecting duct, colon, salivary glands). It converts cortisol → inactive cortisone before cortisol can bind MR. Thus, only aldosterone (not a 11β-HSD2 substrate) activates MR in these tissues.',trap:'Trap: 11β-HSD2 deficiency or inhibition (e.g., licorice → glycyrrhizin inhibits 11β-HSD2) → cortisol activates MR → syndrome of apparent mineralocorticoid excess (HTN + hypokalemia, low aldosterone).'},
{t:'adsynth',lo:'Adrenal androgen importance',q:'A woman presents with sudden loss of pubic and axillary hair after bilateral adrenalectomy. What hormone was lost?',a:'DHEA and DHEA-S from the zona reticularis are the primary adrenal androgens. In women, adrenal androgens are the main source of androgens (converted peripherally). After adrenalectomy, DHEA-S falls markedly → loss of androgen-dependent pubic/axillary hair. Men retain testosterone from testes, so this is more pronounced in women.',trap:'Trap: men have testicular testosterone as backup; women are more dependent on adrenal androgens for body hair.'},
{t:'adsynth',lo:'Hydrophobic steroid biology',q:'Why can\'t steroid hormones be stored in secretory granules like insulin?',a:'Steroids are hydrophobic (lipid-soluble) — they diffuse freely across cell membranes and cannot be stored in aqueous granule lumen. They are synthesized and released continuously as they are made (synthesis = release). This is why stress causes rapid cortisol rise (faster synthesis, not exocytosis of stored hormone).'},
// ── ADRENAL PATHOLOGY ──
{t:'adpath',lo:'Cushing\'s: identify cause from ACTH level',q:'TRAP: Patient has Cushing\'s features. ACTH is 200 pg/mL (markedly elevated). CT chest shows a lung mass. Dexamethasone 8mg overnight → cortisol does NOT suppress. What is the diagnosis?',a:'Ectopic ACTH syndrome — most commonly from small cell lung carcinoma. Very high ACTH (often higher than Cushing\'s Disease). Does NOT suppress with high-dose dexamethasone (no glucocorticoid receptor in tumor cells). Bilateral adrenal hyperplasia (from excess ACTH stimulation). Distinguish from Cushing\'s Disease: Cushing\'s Disease SUPPRESSES with high-dose dexa; ectopic does NOT.',trap:'Trap: Cushing\'s Disease (pituitary) has elevated ACTH (~50-200 pg/mL) AND suppresses with high-dose dexa. Ectopic ACTH is often higher AND does NOT suppress.'},
{t:'adpath',lo:'Waterhouse-Friderichsen syndrome',q:'A 6-year-old presents with septic shock, purpuric rash, and bilateral adrenal hemorrhage. What is this syndrome, and which organism classically causes it?',a:'Waterhouse-Friderichsen syndrome = bilateral adrenal hemorrhagic infarction in the setting of fulminant septicemia. Classic organism: Neisseria meningitidis. Results in acute adrenal cortical insufficiency (hypotension, hypoglycemia). The DIC-associated hemorrhage destroys the adrenal cortex. High mortality without immediate glucocorticoid replacement + antibiotics.',},
{t:'adpath',lo:'Pheochromocytoma features',q:'Why must an alpha-blocker be given BEFORE a beta-blocker in pheochromocytoma?',a:'Pheo secretes both epinephrine and NE. Beta-blockers given first → block beta2-mediated vasodilation → unopposed alpha1-mediated vasoconstriction → hypertensive crisis. Alpha-blocker (phenoxybenzamine, irreversible non-selective) given first → allows vasodilation → then beta-blocker controls tachycardia safely.',trap:'Trap: this is a classic exam trap. Beta-blockers FIRST in pheo can be fatal. Alpha-block first, then beta-block (ALWAYS).'},
{t:'adpath',lo:'Primary hyperaldosteronism (Conn\'s)',q:'A hypertensive patient has low renin and elevated aldosterone. What is the diagnosis, and why is renin low?',a:'Primary hyperaldosteronism (Conn\'s syndrome). Aldosterone is being secreted autonomously (adenoma 35% or bilateral hyperplasia 60%) → sodium retention → volume expansion → high BP → baroreceptors suppress renin release (renin is suppressed because BP is elevated — normal feedback). Key triad: HTN + hypokalemia + suppressed renin.',trap:'Trap: secondary hyperaldosteronism (e.g., renal artery stenosis) has HIGH renin + high aldosterone. Primary hyperaldosteronism has LOW renin + high aldosterone.'},
{t:'adpath',lo:'Adrenal cortical adenoma vs carcinoma',q:'What histologic/clinical features raise concern for adrenal cortical CARCINOMA vs. adenoma?',a:'Carcinoma: large size (>5cm, often >10cm), weight >100g, necrosis, atypical mitoses, vascular invasion, local invasion, Weiss score >3. Adenoma: small (<4cm), lipid-rich, well-circumscribed, no necrosis. Carcinoma is rare but aggressive — may produce excess cortisol AND androgens (mixed hormone excess is suspicious for malignancy).'},
// ── ADRENAL PHARMACOLOGY ──
{t:'adpharm',lo:'Testing the adrenal axis',q:'What is the cosyntropin (ACTH) stimulation test and what does it diagnose?',a:'Cortrosyn (synthetic ACTH 1-24) is given IM/IV → cortisol measured at 0, 30, 60 min. Normal response: peak cortisol >18-20 µg/dL. Blunted response = primary adrenal insufficiency (adrenal cannot respond to ACTH). Note: does NOT distinguish secondary AI well in acute pituitary failure (adrenal not yet atrophied). Used for: Addison\'s diagnosis, evaluating adrenal reserve, pre-surgical assessment.'},
{t:'adpharm',lo:'Metyrapone test',q:'What does metyrapone do, and what result would you expect in Cushing\'s Disease vs adrenal adenoma?',a:'Metyrapone blocks CYP11B1 (11β-hydroxylase) → blocks cortisol synthesis → cortisol drops → ACTH rises (removes negative feedback) → 11-deoxycortisol (precursor) accumulates. Normal/Cushing\'s Disease: ACTH rises markedly + 11-deoxycortisol rises. Adrenal adenoma: ACTH already suppressed; blocked cortisol → minimal ACTH rise → minimal 11-deoxycortisol rise.',trap:'Trap: metyrapone tests PITUITARY RESERVE to respond to falling cortisol. Adrenal adenoma → pituitary already suppressed → can\'t respond.'},
{t:'adpharm',lo:'Blocking agents',q:'A patient with Cushing\'s from an inoperable adrenal carcinoma needs cortisol reduction. Which agents can block adrenal steroid synthesis?',a:'Ketoconazole (broad CYP enzyme inhibitor — multiple steps). Osilodrostat (CYP11B1 inhibitor). Mitotane (adrenolytic — destroys adrenocortical cells; used in carcinoma). Metyrapone (CYP11B1 — shorter term). Mifepristone (blocks glucocorticoid receptor — not synthesis, but blocks action). Levoketoconazole (newer, more selective).'},
{t:'adpharm',lo:'Replacement therapy',q:'A patient with Addison\'s requires replacement. Which steroids are given and why both?',a:'Hydrocortisone (glucocorticoid replacement, cortisol equivalent) + Fludrocortisone (synthetic mineralocorticoid — replaces aldosterone for Na/K balance and blood pressure maintenance). Hydrocortisone alone is insufficient because it has minimal mineralocorticoid activity at physiological replacement doses.',trap:'Trap: hydrocortisone has SOME mineralocorticoid activity, but insufficient for Addison\'s — must give separate fludrocortisone. Dexamethasone has essentially ZERO mineralocorticoid activity.'},
// ── PITUITARY PATHOLOGY ──
{t:'pitpath',lo:'Pituitary adenoma classification',q:'What is the most common functioning pituitary adenoma, and what syndrome does it cause?',a:'Prolactinoma (lactotroph adenoma) — most common. Causes hyperprolactinemia → galactorrhea, amenorrhea/infertility in women; erectile dysfunction, loss of libido in men. Men often present with mass effects (macroadenoma) because symptoms are more subtle. Treat with dopamine agonists (cabergoline, bromocriptine) which reduce prolactin AND shrink the tumor.',trap:'Trap: dopamine agonists are first-line for prolactinoma (even large ones) — surgery is NOT first-line unlike most other adenomas.'},
{t:'pitpath',lo:'Mass effect of pituitary tumors',q:'A patient with a pituitary macroadenoma develops bitemporal hemianopsia AND hypogonadism. Which is from the mass, and which from the hormone?',a:'Bitemporal hemianopsia = mass effect on optic chiasm. Hypogonadism may be: (1) mass effect compressing normal gonadotrophs (hypopituitarism) OR (2) hyperprolactinemia (if prolactinoma) inhibiting GnRH → low LH/FSH → hypogonadism. Need to determine: is it a functioning tumor (prolactin level) or a non-functioning adenoma causing compression?'},
{t:'pitpath',lo:'Sheehan syndrome',q:'A woman has difficulty breastfeeding after a traumatic delivery with significant hemorrhage. 6 months later she has amenorrhea, fatigue, cold intolerance. What happened?',a:'Sheehan syndrome = postpartum pituitary necrosis from ischemia during hemorrhagic shock. The pituitary is enlarged during pregnancy (lactotroph hyperplasia) and vulnerable to ischemia. Loss of lactotrophs → failure of lactation (first sign). Progressive hypopituitarism: LH/FSH → amenorrhea; TSH → hypothyroidism; ACTH → adrenal insufficiency. GH often lost first in functional testing.'},
{t:'pitpath',lo:'Empty sella syndrome',q:'Imaging shows a "empty sella." Is the pituitary functioning normally?',a:'Empty sella = herniation of CSF through a defect in the diaphragma sellae → compresses pituitary against sellar floor → appears empty on MRI. Primary (idiopathic): pituitary usually functions normally — most patients have no hormone deficiency. Secondary: after infarction, surgery, or radiation — may have hypopituitarism.',trap:'Trap: empty sella ≠ hypopituitarism (usually). Primary empty sella is commonly an incidental imaging finding.'},
// ── DIABETES ──
{t:'dm',lo:'Type 1 vs Type 2 pathogenesis',q:'TRAP: A 14-year-old overweight teenager presents with polyuria and polydipsia. Glucose is 380, C-peptide is undetectable. What type of diabetes?',a:'Type 1 DM despite obesity — C-peptide is undetectable, indicating complete destruction of beta cells (no endogenous insulin). Obesity is increasingly common in T1DM and should not lead you to assume T2DM. T2DM would have detectable C-peptide (beta cells still functional). Anti-GAD, anti-IA2 antibodies would confirm T1DM autoimmune etiology.',trap:'Trap: obesity does NOT equal Type 2. Always check C-peptide and autoantibodies. Obese T1DM exists and is increasingly recognized.'},
{t:'dm',lo:'Insulin secretion regulation',q:'What is the "first phase" of insulin secretion, and why is its loss significant in T2DM?',a:'First phase: rapid burst of pre-stored insulin released within 1-2 minutes of glucose stimulus (depletes docked granules). Second phase: sustained release (de novo synthesis). In T2DM, first-phase insulin secretion is lost EARLY — this is the first sign of beta-cell dysfunction and allows post-meal glucose to spike unchecked. By T2DM diagnosis, ~50% of beta-cell mass is already lost.',},
{t:'dm',lo:'DKA vs HHS',q:'TRAP: An elderly T2DM patient presents with glucose of 900 mg/dL, altered consciousness, no ketones in urine, serum osmolarity 385. What is this? Why no ketones?',a:'Hyperosmolar hyperglycemic state (HHS) — NOT DKA. The residual insulin in T2DM is sufficient to prevent ketogenesis (even small amounts of insulin inhibit lipolysis/ketone formation) but insufficient to control glucose. Extreme hyperglycemia + hyperosmolarity is the hallmark. DKA = absolute insulin deficiency → ketones. HHS = relative insulin deficiency → no ketones.',trap:'Trap: no ketones in T2DM hyperglycemia → think HHS, not DKA. Mortality of HHS is higher than DKA (older patients, delayed presentation).'},
{t:'dm',lo:'Metformin mechanism and contraindications',q:'Why is metformin contraindicated in severe renal failure?',a:'Metformin is renally cleared — in renal failure it accumulates → impairs hepatic mitochondrial electron transport → lactic acidosis (rare but fatal). Hold metformin when eGFR <30 mL/min (reduce dose at <45). Also hold before contrast procedures temporarily.',trap:'Trap: metformin does NOT cause hypoglycemia (no insulin secretion effect — activates AMPK). It causes GI side effects (nausea, diarrhea) and rarely lactic acidosis.'},
{t:'dm',lo:'Sulfonylurea mechanism',q:'How do sulfonylureas lower blood glucose? What is their main adverse effect?',a:'Sulfonylureas (glipizide, glyburide) close K-ATP channels on pancreatic beta cells → membrane depolarization → Ca2+ influx → insulin granule exocytosis. They work REGARDLESS of glucose level → hypoglycemia is the major risk, especially in the elderly and with renal impairment (extended drug effect). Glyburide especially problematic in elderly.'},
{t:'dm',lo:'GLP-1 agonists',q:'Why do GLP-1 agonists cause weight loss but NOT hypoglycemia in isolation?',a:'GLP-1 agonists stimulate insulin secretion in a GLUCOSE-DEPENDENT manner (only when glucose is elevated) → no insulin release in normoglycemia → no hypoglycemia. Weight loss: suppress glucagon, slow gastric emptying (satiety), act on hypothalamic satiety centers. Combine with insulin → hypoglycemia risk increases (not from GLP-1 directly).'},
{t:'dm',lo:'Microvascular complications',q:'Explain the pathogenesis of diabetic nephropathy.',a:'Chronic hyperglycemia → (1) Advanced glycation end-products (AGEs) damage glomerular basement membrane. (2) Polyol pathway → sorbitol accumulation → osmotic damage. (3) PKC activation → VEGF ↑ → neovascularization + permeability. Result: mesangial expansion → Kimmelstiel-Wilson nodules → glomerulosclerosis → proteinuria → ESRD. DM is the #1 cause of ESRD in the US. ACEi/ARB slows progression.'},
{t:'dm',lo:'Insulin types and timing',q:'TRAP: A patient taking insulin glargine (long-acting) notes it peaks 4-6 hours after injection and wears off by 14 hours. Should you believe this report?',a:'No — this is incorrect. Glargine (Lantus) has NO pronounced peak and lasts ~24 hours (near-peakless basal insulin). It forms microprecipitates at the injection site and releases slowly. If the patient is experiencing effects at 4-6 hours, suspect: wrong insulin drawn up (regular or NPH), lipohypertrophy at injection site altering absorption, or reporting a different symptom.',trap:'Trap: "peakless" long-acting insulins (glargine, detemir) genuinely have flat profiles. Any patient reporting a "peak" should prompt review of which insulin they actually used.'},
];

let deck=[...CARDS], idx=0, flipped=false, known=new Set(), rev=new Set();

function filterFC(){
  const f=document.getElementById('fc-fil').value;
  const tp=document.getElementById('fc-type').value;
  deck=CARDS.filter(c=>{
    const topicOk=(f==='all'||c.t===f);
    const typeOk=(tp==='all'||(tp==='trap'&&c.trap));
    return topicOk&&typeOk;
  });
  idx=0;flipped=false;document.getElementById('ci').classList.remove('flipped');
  showCard();
}
function shuffleFC(){deck.sort(()=>Math.random()-.5);idx=0;flipped=false;document.getElementById('ci').classList.remove('flipped');showCard();}
function resetFC(){known.clear();rev.clear();idx=0;flipped=false;document.getElementById('ci').classList.remove('flipped');showCard();}
function showCard(){
  if(!deck.length){document.getElementById('cq').textContent='No cards match this filter.';return;}
  const c=deck[idx];
  document.getElementById('ctag').textContent=TLABELS[c.t]||c.t;
  document.getElementById('cobj').textContent='Obj: '+c.lo;
  document.getElementById('cq').textContent=c.q;
  document.getElementById('ctag2').textContent=TLABELS[c.t]||c.t;
  document.getElementById('ca').textContent=c.a;
  const tr=document.getElementById('ctrap');
  if(c.trap){tr.textContent='⚠ Trap: '+c.trap;tr.style.display='block';}else{tr.style.display='none';}
  document.getElementById('fc-prog').textContent=(idx+1)+' / '+deck.length;
  const k=known.size,r=rev.size;
  document.getElementById('fc-stat').textContent=k+r>0?'✓ '+k+' known  ·  ↺ '+r+' to review':'';
}
function flipFC(){flipped=!flipped;document.getElementById('ci').classList.toggle('flipped',flipped);}
function nextFC(){idx=(idx+1)%deck.length;flipped=false;document.getElementById('ci').classList.remove('flipped');showCard();}
function prevFC(){idx=(idx-1+deck.length)%deck.length;flipped=false;document.getElementById('ci').classList.remove('flipped');showCard();}
function markFC(type){const c=deck[idx];if(type==='k'){known.add(c.q);rev.delete(c.q);}else{rev.add(c.q);known.delete(c.q);}nextFC();}
showCard();

const QS=[
{t:'intro',trap:false,lo:'Hormone class → receptor type',vig:'A researcher adds a water-soluble peptide hormone to a cell culture and observes a cAMP rise within 15 seconds.',q:'Which of the following best explains the rapid onset?',opts:['The hormone crossed the plasma membrane and bound a nuclear receptor','The hormone bound a membrane GPCR → Gs → adenylyl cyclase → cAMP','The hormone induced gene transcription via a ligand-gated ion channel','The hormone required 11β-HSD2 activation before it could act'],ok:1,expl:'Peptide hormones are hydrophilic — they CANNOT cross the plasma membrane. They bind surface GPCRs (or enzyme-linked receptors). A Gs-coupled GPCR → adenylyl cyclase → cAMP cascade occurs in seconds. Nuclear receptor signaling (steroids, TH) takes hours. TRAP: Students confuse "rapid" with "small molecule" — the speed depends on signal transduction, not hormone size per se.',kp:['Peptides = surface receptors = fast','Steroids = nuclear receptors = slow (hours)','cAMP = Gs/adenylyl cyclase cascade']},
{t:'hprel',trap:true,lo:'Predict portal flow blockage effect',vig:'An experiment blocks pituitary portal blood flow in a rat. Investigators measure anterior pituitary hormone levels 2 hours later.',q:'Which hormone would be ELEVATED compared to pre-block levels?',opts:['TSH','ACTH','Prolactin','LH'],ok:2,expl:'TRAP: All hypothalamic hormones are stimulatory EXCEPT dopamine, which tonically inhibits prolactin. Block portal flow → all releasing hormones drop → TSH, ACTH, LH, FSH, GH fall. But dopamine (PIF) also drops → prolactin inhibition is removed → prolactin RISES. This is why any stalk compression (even non-functioning adenoma) raises prolactin.',kp:['Portal blockage: all hormones fall EXCEPT prolactin rises','Dopamine = prolactin-inhibiting factor (PIF)','Stalk compression → hyperprolactinemia']},
{t:'hprel',trap:false,lo:'Ablation of target gland',vig:'A patient undergoes bilateral thyroidectomy for papillary carcinoma. Labs drawn 6 weeks later.',q:'What would you expect TSH and TRH levels to be?',opts:['TSH high, TRH low','TSH high, TRH high','TSH low, TRH low','TSH normal, TRH normal'],ok:1,expl:'Removing the thyroid eliminates T3/T4 → no long-loop negative feedback → BOTH TRH (hypothalamus) AND TSH (pituitary) rise. TRH rises because T3 normally inhibits TRH gene expression. TSH rises because T3 normally inhibits thyrotrophs. This is exploited clinically: stop thyroid replacement after thyroidectomy → TSH rises → residual thyroid tissue (or metastases) that take up iodine can be detected/ablated.',kp:['No thyroid → ↑TSH + ↑TRH','Exploited for I-131 scanning post-thyroidectomy','Same logic: adrenalectomy → ↑ACTH + ↑CRH']},
{t:'post',trap:true,lo:'Central vs nephrogenic vs gestational DI',vig:'Three patients all have polyuria (>4L/day) and dilute urine (urine osm 80). Patient A: urine concentrates to 650 after DDAVP. Patient B: urine remains dilute (90) after DDAVP. Patient C: 32 weeks pregnant, urine concentrates after DDAVP.',q:'Match patients to: central DI, nephrogenic DI, gestational DI.',opts:['A=gestational, B=central, C=nephrogenic','A=central, B=nephrogenic, C=gestational','A=nephrogenic, B=central, C=gestational','All three are nephrogenic DI'],ok:1,expl:'DDAVP response is the key: Central DI = can\'t make AVP → kidney responds to exogenous DDAVP → urine concentrates (A). Nephrogenic DI = kidney V2R or AQP2 defect → doesn\'t respond to DDAVP → stays dilute (B). Gestational DI = vasopressinase degrades AVP but DDAVP is vasopressinase-resistant → concentrates (C). TRAP: Gestational DI looks identical to central on water deprivation but is distinguished by the clinical context.',kp:['DDAVP works: central DI','DDAVP fails: nephrogenic DI','Pregnant + DDAVP works: gestational DI']},
{t:'post',trap:false,lo:'AVP V1 vs V2 receptors',vig:'A patient with central DI requires treatment. The physician wants to treat only the antidiuretic defect without raising blood pressure.',q:'Why is DDAVP preferred over natural AVP for central DI?',opts:['DDAVP crosses the blood-brain barrier; AVP does not','DDAVP is V2-selective (antidiuretic), lacks V1a vasoconstrictor effect; longer half-life','DDAVP stimulates oxytocin receptors providing additional benefit','DDAVP is given IV only, making dosing more precise'],ok:1,expl:'DDAVP (1-desamino-8-D-arginine vasopressin) modifications: (1) deamination of N-terminal cysteine → longer half-life (avoids vasopressinase). (2) D-arginine at position 8 → V2 selectivity (no V1a binding → no vasoconstriction). AVP activates both V1a (vasoconstriction, platelet aggregation) and V2 (antidiuresis). Nasal or oral administration avoids first-pass metabolism.',kp:['DDAVP = V2-selective = antidiuretic only','Natural AVP = V1a + V2 (vasoconstriction + antidiuresis)','DDAVP is vasopressinase-resistant (gestational DI)']},
{t:'gh',trap:true,lo:'GH stimulators and inhibitors',vig:'A 45-year-old obese man (BMI 38) is being evaluated. His random GH level is low. His physician suspects GH deficiency and orders an insulin tolerance test (ITT). After insulin-induced hypoglycemia, GH rises to 6 ng/mL (normal response: >5 ng/mL).',q:'What does this result indicate?',opts:['GH deficiency confirmed — low random GH is diagnostic','GH reserve is intact — the low random GH was due to obesity-related GH suppression','GH deficiency confirmed — 6 ng/mL is still low','The patient has acromegaly with GH hypersecretion'],ok:1,expl:'TRAP: Low random GH in obese patients does NOT mean GH deficiency. Obesity (via elevated FFA) suppresses GH pulsatility → randomly low GH. Provocative testing (ITT = hypoglycemia = a potent GH stimulus) is required for diagnosis. A normal GH response (>5) to hypoglycemia rules out deficiency. The obesity-related suppression is reversible with weight loss.',kp:['Random GH is meaningless for deficiency','Obesity suppresses GH (elevated FFA)','Hypoglycemia = most potent GH stimulus — used for provocative testing']},
{t:'gh',trap:false,lo:'Acromegaly pathophysiology',vig:'A 50-year-old man presents with enlarging ring size over 3 years, jaw protrusion, deepened voice, new-onset diabetes, carpal tunnel syndrome, and sleep apnea. IGF-1 is 3x upper normal. GH after oral glucose load is 4 ng/mL (should suppress to <1).',q:'What is the mechanism of his glucose intolerance?',opts:['GH stimulates autoimmune destruction of beta cells','GH directly causes insulin resistance in muscle and adipose + promotes gluconeogenesis','Elevated IGF-1 activates insulin receptors causing reactive hypoglycemia','GH deficiency causes impaired glycogen breakdown'],ok:1,expl:'GH is directly diabetogenic: promotes insulin resistance in muscle (blocks glucose uptake) and adipose + stimulates hepatic gluconeogenesis. Paradox: GH is anabolic for protein/bone but diabetogenic for glucose. Acromegaly → DM in ~25-30% of patients. The GOLD STANDARD for acromegaly diagnosis: failure of GH to suppress below 1 ng/mL after 75g oral glucose (normal GH is suppressed by glucose).',kp:['GH = insulin resistance + gluconeogenesis = diabetogenic','Acromegaly gold standard = oral glucose suppression test','IGF-1 = best screening test (stable, no pulsatility)']},
{t:'hpt',trap:true,lo:'TSH vs TH interpretation',vig:'A 30-year-old woman is found to have TSH = 0.2 mIU/L (low) on routine screening. She is asymptomatic, has no goiter, and denies any symptoms. Total T4 is 9 µg/dL (normal 4.6-12) and free T4 is normal.',q:'What is the most likely explanation?',opts:['Subclinical hyperthyroidism — thyroid hormone is mildly elevated beyond what TSH measures','Primary hypothyroidism — TSH should be high, but there is a lab error','Subclinical hyperthyroidism — autonomous thyroid tissue suppresses TSH but hasn\'t yet raised T4 to symptomatic levels','Secondary hypothyroidism — pituitary cannot secrete TSH'],ok:2,expl:'Subclinical hyperthyroidism: TSH is suppressed (sensitive indicator), but T4/T3 are still in the normal range. Causes: early Graves\', toxic nodule, multinodular goiter. TSH is the most sensitive test — it falls BEFORE TH rises above normal range. TRAP: normal T4 does NOT rule out thyroid dysfunction. TSH is the first-line, most sensitive marker.',kp:['TSH falls before T4 rises in hyperthyroidism','Subclinical hyperthyroid = low TSH, normal T4','TSH is the most sensitive thyroid function test']},
{t:'hpt',trap:false,lo:'Thyroid cancer histology',vig:'Pathology from a 35-year-old woman\'s thyroid lobectomy shows follicular architecture with tumor cells that have invaded through the capsule into blood vessels.',q:'What distinguishes this diagnosis from a follicular adenoma?',opts:['Nuclear features: ground-glass nuclei and nuclear grooves','Capsular and/or vascular invasion on histology','Positive calcitonin staining by immunohistochemistry','High mitotic rate >10/HPF'],ok:1,expl:'Follicular adenoma and follicular carcinoma are IDENTICAL on FNA (both show follicular architecture). The ONLY distinguishing feature is invasion: capsular invasion OR vascular invasion on the resected specimen = carcinoma. FNA cannot diagnose follicular carcinoma — hemithyroidectomy is required. TRAP: Nuclear features (Orphan Annie) distinguish PAPILLARY carcinoma, not follicular.',kp:['Follicular carcinoma = capsular + vascular invasion','FNA cannot diagnose follicular carcinoma','Papillary = nuclear features; Follicular = invasion']},
{t:'hpt',trap:true,lo:'Secondary vs tertiary hyperparathyroidism',vig:'A patient with CKD stage 5 on dialysis has PTH = 800 pg/mL (very high), calcium = 10.8 mg/dL (elevated), phosphate = 6.2 mg/dL (high).',q:'What has occurred, and why is calcium now elevated?',opts:['Primary hyperparathyroidism — adenoma formed de novo','Secondary hyperparathyroidism — calcium rises from excess PTH effect','Tertiary hyperparathyroidism — chronically stimulated parathyroid glands have become autonomous and secrete PTH independently of calcium levels','Familial hypocalciuric hypercalcemia — CaSR mutation'],ok:2,expl:'Tertiary HPT: in CKD, chronic hypocalcemia drives prolonged PTH secretion (secondary HPT). Over years, the parathyroid glands undergo nodular hyperplasia and become autonomous — they continue secreting PTH even when calcium is corrected (e.g., after renal transplant or on dialysis with adequate calcium). Now calcium rises despite high PTH. Treatment: parathyroidectomy.',kp:['Secondary HPT = high PTH + low/normal Ca (CKD)','Tertiary HPT = high PTH + high Ca (autonomous glands)','Tertiary → parathyroidectomy required']},
{t:'hpa',trap:false,lo:'Cortisol metabolic effects: high vs low',vig:'A patient on long-term prednisone 40mg/day for inflammatory bowel disease undergoes elective knee surgery. He had been taking prednisone for 2 years. Anesthesia is induced; within 30 min his BP drops to 60/40 despite fluids.',q:'What is the mechanism of this crisis?',opts:['Prednisone caused hypertension and this is rebound hypotension','Chronic exogenous steroids suppress the HPA axis → adrenal atrophy → insufficient cortisol response to surgical stress','Prednisone sensitized the vasculature to catecholamines','Prednisone caused autoimmune destruction of the adrenal cortex'],ok:1,expl:'Chronic exogenous steroids → suppress CRH/ACTH via long-loop feedback → adrenal cortex atrophies from lack of ACTH stimulation → cannot mount physiological cortisol stress response during surgery → adrenal crisis. KEY RULE: do NOT abruptly withdraw steroids + give stress-dose steroids perioperatively for chronic steroid users.',kp:['Chronic exogenous steroids → HPA suppression → adrenal atrophy','Never abruptly stop chronic steroids','Perioperative stress dose: hydrocortisone 50-100mg q8h']},
{t:'hpa',trap:true,lo:'Cushing\'s Disease vs Syndrome vs ectopic',vig:'Patient 1: ACTH 85 pg/mL, MRI shows 7mm pituitary lesion, 8mg dex suppresses. Patient 2: ACTH 450 pg/mL, chest CT shows 2cm central lung mass, 8mg dex does NOT suppress. Patient 3: ACTH <5 pg/mL, CT shows 3cm right adrenal mass.',q:'Match each patient to their diagnosis.',opts:['P1=ectopic, P2=Cushing\'s Disease, P3=adrenal adenoma','P1=Cushing\'s Disease, P2=ectopic ACTH, P3=adrenal adenoma','P1=adrenal adenoma, P2=Cushing\'s Disease, P3=ectopic','P1=Cushing\'s Disease, P2=adrenal adenoma, P3=ectopic'],ok:1,expl:'P1: Moderate ACTH elevation + pituitary lesion + SUPPRESSES with high-dose dex = Cushing\'s Disease (pituitary ACTH adenoma retains partial feedback sensitivity). P2: Very high ACTH + lung mass + does NOT suppress = ectopic ACTH (small cell carcinoma). P3: ACTH is suppressed (adrenal makes cortisol autonomously → negative feedback kills pituitary ACTH) + adrenal mass = primary adrenal adenoma.',kp:['Pituitary Cushing\'s: moderate ACTH, suppresses with high-dose dexa','Ectopic ACTH: very high ACTH, no suppression','Adrenal adenoma: suppressed ACTH, unilateral mass']},
{t:'adsynth',trap:true,lo:'Zone enzyme products — glomerulosa trap',vig:'A patient has isolated aldosterone deficiency with normal cortisol levels. Which enzyme deficiency is most consistent?',opts:['21-hydroxylase (CYP21A2)','CYP11B2 (aldosterone synthase)','11β-hydroxylase (CYP11B1)','CYP17A1 (17α-hydroxylase)'],ok:1,vig:'A patient has isolated aldosterone deficiency with normal cortisol levels and normal androgens. Serum renin is very high.',q:'Which enzyme deficiency is most consistent with ISOLATED aldosterone deficiency?',expl:'CYP11B2 (aldosterone synthase) is expressed ONLY in zona glomerulosa. Its deficiency → isolated hypoaldosteronism (salt-wasting) with normal cortisol (fasciculata is intact). TRAP: 21-OHD knocks out BOTH cortisol AND aldosterone. CYP11B1 deficiency blocks cortisol + causes DOC accumulation (HTN). CYP17A1 deficiency blocks cortisol AND sex steroids. Only CYP11B2 deficiency causes isolated aldosterone loss.',kp:['CYP11B2 = aldosterone synthase = glomerulosa ONLY','CYP11B2 deficiency = salt-wasting + no virilization','ACTH does NOT stimulate CYP11B2 (Ang II + K+ do)']},
{t:'adsynth',trap:false,lo:'Mineralocorticoid receptor selectivity',vig:'A patient chews large amounts of licorice daily for months. She develops hypertension and hypokalemia. Renin is low and aldosterone is LOW.',q:'What is the mechanism of her syndrome?',opts:['Licorice contains aldosterone that directly activates MR','Glycyrrhizin in licorice inhibits 11β-HSD2 → cortisol accumulates in kidney → activates MR → sodium retention','Licorice stimulates the adrenal directly to overproduce aldosterone','Licorice contains an ARB that paradoxically causes sodium retention'],ok:1,expl:'Glycyrrhizin (active compound in licorice) inhibits 11β-HSD2 (the enzyme that converts cortisol → inactive cortisone in kidney). Without 11β-HSD2, cortisol (present at much higher concentrations than aldosterone) activates MR → Na+ retention + K+ excretion → HTN + hypokalemia. Aldosterone itself is suppressed by negative feedback (elevated BP). "Syndrome of apparent mineralocorticoid excess."',kp:['11β-HSD2 normally protects kidney MR from cortisol','Licorice/glycyrrhizin = 11β-HSD2 inhibitor','Result: apparent mineralocorticoid excess (HTN + hypoK) with LOW aldosterone']},
{t:'adpath',trap:true,lo:'Pheochromocytoma treatment order',vig:'A 38-year-old with known pheochromocytoma is scheduled for surgery in 2 weeks. Her resting BP is 180/110 with episodic spikes to 240/140. Her cardiologist recommends starting metoprolol (beta-blocker) to control heart rate.',q:'Why is this recommendation potentially dangerous?',opts:['Beta-blockers are ineffective in pheo — they have no effect on catecholamines','Starting a beta-blocker before alpha-blockade → removes beta2-mediated vasodilation → unopposed alpha1-mediated vasoconstriction → hypertensive crisis','Beta-blockers directly stimulate catecholamine release from the tumor','Metoprolol is a prodrug that requires hepatic conversion, contraindicated in adrenal disease'],ok:1,expl:'Critical sequence: ALPHA FIRST, THEN BETA. Pheo secretes epi+NE → both alpha (vasoconstriction) and beta2 (vasodilation) receptors activated. Beta-blockade alone removes vasodilation → unopposed alpha → severe vasoconstriction → hypertensive crisis + possible MI/CVA. ALWAYS give phenoxybenzamine (irreversible alpha-blocker) 10-14 days pre-op, then add beta-blocker after alpha-blockade is established.',kp:['Alpha FIRST, then beta in pheo prep','Beta first = unopposed alpha = hypertensive crisis','Phenoxybenzamine = irreversible non-selective alpha-blocker (10-14 days pre-op)']},
{t:'adpath',trap:false,lo:'Primary vs secondary hyperaldosteronism',vig:'Two patients with hypertension: Patient A has high aldosterone and HIGH renin. Patient B has high aldosterone and LOW renin.',q:'Distinguish the pathophysiology in each patient.',opts:['A=primary hyperaldosteronism, B=secondary hyperaldosteronism','A=secondary hyperaldosteronism, B=primary hyperaldosteronism','Both have primary hyperaldosteronism','Both have secondary hyperaldosteronism'],ok:1,expl:'Patient A (high aldosterone + HIGH renin): Secondary hyperaldosteronism — high renin drives aldosterone (e.g., renal artery stenosis, CHF, cirrhosis — all cause reduced renal perfusion → RAAS activation). Patient B (high aldosterone + LOW renin): Primary hyperaldosteronism — autonomous aldosterone production (adenoma or bilateral hyperplasia) → volume expansion → suppresses renin via baroreceptor feedback.',kp:['Primary: high aldo + LOW renin (autonomous, suppresses RAAS)','Secondary: high aldo + HIGH renin (RAAS activated by reduced perfusion)','Aldosterone:renin ratio >30 → screen for primary hyperaldosteronism']},
{t:'adpharm',trap:false,lo:'Replacement therapy in Addison\'s',vig:'A patient with Addison\'s disease is on hydrocortisone 20mg AM / 10mg PM. He is admitted for emergency appendectomy.',q:'What modification to his steroid regimen is required?',opts:['Hold steroids perioperatively to prevent infection','Continue his usual dose — no change needed','Give stress-dose steroids: hydrocortisone 50-100mg IV q8h for the perioperative period','Switch to dexamethasone (longer-acting, more potent)'],ok:2,expl:'Patients with adrenal insufficiency cannot mount a cortisol stress response. Major surgery requires 3-5x the usual daily dose ("stress dosing"). Give hydrocortisone 50-100mg IV q8h for major surgery. Taper back to maintenance over 1-3 days post-op if recovering well. Dexamethasone is NOT used for replacement (no mineralocorticoid activity; also interferes with cortisol measurements if needed).',kp:['Adrenal insufficiency + stress → stress dose hydrocortisone','Do NOT hold steroids perioperatively','Dexamethasone has no mineralocorticoid activity — not ideal for replacement']},
{t:'pitpath',trap:true,lo:'Stalk compression and prolactin',vig:'A 45-year-old woman has a 2.5cm sellar mass on MRI with bitemporal hemianopsia. Prolactin is 85 ng/mL (slightly elevated, normal <25). The radiologist suggests this could be a prolactinoma.',q:'What critical question must be answered before starting dopamine agonist therapy?',opts:['Whether the patient is premenopausal or postmenopausal','Whether the hyperprolactinemia is from a true prolactinoma or from stalk compression by a non-prolactinoma mass','Whether dopamine agonist will cross the blood-brain barrier in this patient','Whether the mass is enhancing on MRI'],ok:1,expl:'TRAP: Mildly elevated prolactin in a patient with a large mass may be from STALK COMPRESSION (any mass compressing the infundibular stalk → removes dopamine → mild prolactin elevation typically <100-150 ng/mL), NOT a true prolactinoma. True prolactinomas causing macroadenoma typically have prolactin >200-500 ng/mL. If you misidentify a craniopharyngioma or non-functioning adenoma as a prolactinoma and give dopamine agonist → mass will NOT shrink and patient loses time.',kp:['Stalk compression → mild prolactin elevation (<150 ng/mL)','True prolactinoma macroadenoma → prolactin usually >200-500 ng/mL','Always correlate prolactin level with mass size']},
{t:'pitpath',trap:false,lo:'Hypopituitarism causes',vig:'A 28-year-old woman had a traumatic delivery requiring blood transfusion 6 months ago. She reports inability to breastfeed, no return of menses, fatigue, cold intolerance, and dizziness.',q:'Name the syndrome and list the hormone deficiencies in likely order of presentation.',opts:['Empty sella syndrome — presents with visual loss first','Sheehan syndrome — lactotrophs (prolactin) fail first, then gonadotrophs, then thyrotrophs, then corticotrophs','Lymphocytic hypophysitis — primarily affects ACTH-secreting cells','Craniopharyngioma — primarily affects GH first in adults'],ok:1,expl:'Sheehan syndrome = postpartum pituitary necrosis. The enlarged pituitary (pregnancy-related lactotroph hyperplasia) is vulnerable to ischemia in hemorrhagic shock. Failure of lactation (prolactin) is classically the first sign. Then gonadotropins fail (amenorrhea), then TSH (cold intolerance), then ACTH (fatigue/hypotension). GH is usually lost earliest on formal testing but GH deficiency may be clinically silent in adults.',kp:['Sheehan = postpartum hemorrhage → pituitary ischemia','First sign: failure of lactation (prolactin lost)','Progressive hypopituitarism: Gn → TSH → ACTH → GH']},
{t:'dm',trap:true,lo:'DKA K+ paradox',vig:'A 22-year-old T1DM presents with DKA. Labs: glucose 520, pH 7.15, K+ 6.0 mEq/L (high). IV insulin infusion is started. 2 hours later K+ is 2.9 mEq/L (critically low).',q:'Explain why serum K+ was initially high and dropped rapidly with insulin.',opts:['Insulin caused renal K+ excretion','Initial hyperkalemia was from dehydration concentrating the serum; insulin fixed dehydration','Insulin deficiency prevented K+ entry into cells + acidosis drove K+/H+ exchange out of cells → serum K+ high despite total body K+ depletion. Insulin drives K+ back into cells → serum K+ falls rapidly.','Insulin activated aldosterone which caused K+ excretion'],ok:2,expl:'Classic DKA K+ physiology: TOTAL body K+ is depleted (osmotic diuresis). Serum K+ is paradoxically ELEVATED because: (1) Insulin deficiency → GLUT4/Na-K-ATPase → K+ cannot enter cells. (2) Metabolic acidosis → H+ enters cells → K+ exchanges out. With insulin infusion → K+ re-enters cells rapidly → serum K+ crashes. MUST monitor K+ every 1-2 hours. Replace K+ aggressively BEFORE starting insulin if K+ <3.5.',kp:['DKA: total body K+ depleted, serum K+ high (cell shift)','Insulin drives K+ into cells → serum K+ drops rapidly','Replace K+ before insulin if K+ <3.5 (risk of fatal arrhythmia)']},
{t:'dm',trap:false,lo:'Type 2 DM pharmacology: SGLT2i',vig:'A 64-year-old woman with T2DM, HFrEF (EF 30%), and CKD stage 3 is on metformin. HbA1c is 7.8%. Her cardiologist wants to add a second agent.',q:'Which agent provides the strongest evidence for reducing heart failure hospitalizations in this patient?',opts:['Sulfonylurea — well-established glucose lowering','Sitagliptin (DPP-4i) — proven HF benefit in trials','Empagliflozin (SGLT2i) — proven reduction in HF hospitalizations and CKD progression in multiple landmark trials','Pioglitazone (TZD) — reduces insulin resistance which is key in HFrEF'],ok:2,expl:'SGLT2 inhibitors (empagliflozin, dapagliflozin, canagliflozin): multiple RCTs (EMPA-REG OUTCOME, DAPA-HF, EMPEROR-Reduced, CREDENCE) show significant reduction in HF hospitalizations + CKD progression + CV mortality. Mechanism: glycosuria → natriuresis → reduced preload. DPP-4i are CV neutral. TZD (pioglitazone) → AVOID in HFrEF (worsens fluid retention). Sulfonylurea → no CV benefit.',kp:['SGLT2i = first-line add-on in HFrEF + DM','TZD contraindicated in HF (fluid retention)','DPP-4i = glucose neutral on CV outcomes']},
{t:'dm',trap:true,lo:'Insulin physiology — T3 binding trap',vig:'A patient is found to have elevated total T4 but normal free T4. She is asymptomatic. She was recently started on oral contraceptive pills (OCPs).',q:'What is the most likely explanation for the elevated total T4?',opts:['Graves\' disease — OCPs cause autoimmunity','Subclinical hyperthyroidism — TSH will be suppressed','Estrogen in OCPs increases thyroid-binding globulin (TBG) → more T4 is bound → total T4 rises, but free T4 (active) is unchanged','Methimazole contamination in the OCP formulation'],ok:2,expl:'TRAP: Elevated TOTAL T4 does NOT mean hyperthyroidism if FREE T4 is normal. Estrogen (pregnancy, OCPs) → increases TBG synthesis → more binding capacity → more total T4 bound → total T4 rises, free T4 remains constant. TSH will be NORMAL (no actual hyperthyroidism). Similarly, pregnancy causes elevated total TH — do NOT treat. This is why FREE T4 and TSH are more clinically meaningful than total T4 alone.',kp:['Estrogen/pregnancy → ↑TBG → ↑total T4, normal free T4, normal TSH','Free T4 = active fraction; total T4 can be misleading','Do NOT treat elevated total T4 if free T4 and TSH are normal']},
{t:'adsynth',trap:true,lo:'17α-hydroxylase deficiency',vig:'A 17-year-old phenotypically female patient presents with primary amenorrhea and no pubic/axillary hair. Her karyotype is 46,XY. BP is 170/105. Labs: very high progesterone, very high DOC, low cortisol, low androgens.',q:'What is the enzyme deficiency?',opts:['21-hydroxylase (CYP21A2)','5α-reductase','17α-hydroxylase (CYP17A1)','11β-hydroxylase (CYP11B1)'],ok:2,expl:'CYP17A1 (17α-hydroxylase) deficiency: required for both cortisol AND sex steroid synthesis (both 17α-hydroxylation of progesterone/pregnenolone). Without it: low cortisol → high ACTH → cortex is driven to make steroids, but everything is shunted into mineralocorticoid pathway (DOC accumulates) → HTN + hypokalemia. No sex steroids → 46,XY individuals have female external genitalia (müllerian structures regress from AMH, but no testosterone). TRAP: THIS IS THE "HTN + NO SEX STEROIDS" CAH.',kp:['17α-OHD = no cortisol, no sex steroids, excess DOC → HTN','XY = female phenotype, undescended testes','DISTINGUISHING: 21-OHD = salt-wasting; 11β-OHD = HTN+virilization; 17α-OHD = HTN+no sex steroids']},
{t:'hpt',trap:false,lo:'Thyroid hormone receptor action',vig:'A medical student reads that the thyroid hormone receptor (TR) is found in the nucleus and binds DNA even WITHOUT T3 bound.',q:'What is the functional consequence of unliganded TR bound to a thyroid response element (TRE)?',opts:['Constitutive gene activation in hypothyroid state','TR without T3 REPRESSES transcription at TREs (recruits corepressors). T3 binding causes conformational change → corepressors released, coactivators recruited → transcription activated.','Unliganded TR causes membrane receptor activation','TR without T3 is exported from nucleus and degraded'],ok:1,expl:'Key feature of nuclear receptors: TR represses at TREs without hormone, activates with T3. This is why hypothyroidism causes active gene repression (not just lack of activation) — TR actively silences TRE-containing genes. In contrast, TRE-containing genes with "negative TREs" (nTREs) — such as TSH subunits — are ACTIVATED without T3 and REPRESSED with T3 (explains why high T3 suppresses TSH).',kp:['Unliganded TR at TRE → REPRESSES transcription','T3-bound TR at TRE → ACTIVATES transcription','nTRE (e.g., TSH): opposite — T3 represses → explains feedback']},
{t:'intro',trap:false,lo:'Enzyme synthesis of catecholamines',vig:'A medical student traces the biosynthesis of epinephrine in the adrenal medulla.',q:'What is the rate-limiting step in catecholamine synthesis, and what uniquely enables the adrenal medulla (but not peripheral sympathetic neurons) to produce epinephrine?',opts:['Rate-limiting: COMT; adrenal medulla uniquely expresses dopamine decarboxylase','Rate-limiting: tyrosine hydroxylase (Tyr → DOPA); PNMT (NE → epi) is induced by high glucocorticoid concentrations from adrenocortical portal blood — only present in adrenal medulla','Rate-limiting: MAO; adrenal medulla lacks COMT allowing epinephrine synthesis','Rate-limiting: dopamine β-hydroxylase; all chromaffin cells express PNMT'],ok:1,expl:'Catecholamine synthesis: Tyrosine → (TH, rate-limiting) → DOPA → (DOPA decarboxylase) → Dopamine → (DβH) → NE → (PNMT) → Epinephrine. PNMT requires very high glucocorticoid exposure for induction/maintenance. The adrenocortical portal blood system bathes medullary chromaffin cells in high cortisol — peripheral sympathetic neurons and extra-adrenal chromaffin cells lack this → they produce NE but NOT epinephrine.',kp:['TH = rate-limiting in catecholamine synthesis','PNMT = NE→Epi, requires glucocorticoids from local portal blood','Adrenalectomy → ↓epinephrine; NE from sympathetic neurons unchanged']},
{t:'dm',trap:true,lo:'Incretin-based therapy',vig:'A nurse educator tells a T2DM patient that his new GLP-1 agonist (semaglutide) will cause hypoglycemia similar to his old sulfonylurea.',q:'Why is this statement incorrect?',opts:['GLP-1 agonists do not lower blood glucose at all','GLP-1 agonists stimulate insulin secretion in a GLUCOSE-DEPENDENT manner — at normal glucose levels, they do NOT trigger insulin release, so hypoglycemia does not occur in isolation','GLP-1 agonists work only in the pancreas and have no effect on other tissues','Semaglutide is not approved for use in T2DM'],ok:1,expl:'This is the key pharmacological distinction: GLP-1 agonists are glucose-dependent insulinotropic agents. They stimulate insulin ONLY when glucose is elevated (they require glucose to act on the beta-cell K-ATP/cAMP pathway). At normoglycemia, no excess insulin → no hypoglycemia. Sulfonylureas close K-ATP channels regardless of glucose → insulin secreted even in fasting → hypoglycemia. TRAP: If combined with insulin, GLP-1 agonists CAN contribute to hypoglycemia indirectly.',kp:['GLP-1 agonists = glucose-DEPENDENT → no solo hypoglycemia','Sulfonylureas = glucose-INDEPENDENT → hypoglycemia risk','GLP-1 + insulin → increased hypoglycemia risk (monitor)']},
];

let qScore=0, qTotal=0, qAnswered=false;

function getPool(){
  const f=document.getElementById('q-fil').value;
  if(f==='trap') return QS.filter(q=>q.trap);
  if(f==='all') return QS;
  return QS.filter(q=>q.t===f);
}
function loadQ(){
  qAnswered=false;
  const pool=getPool();
  if(!pool.length){document.getElementById('vig').textContent='No questions for this filter.';document.getElementById('qt').textContent='';document.getElementById('opts').innerHTML='';document.getElementById('expl').style.display='none';document.getElementById('trap-flag').innerHTML='';return;}
  const q=pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('trap-flag').innerHTML=q.trap?'<div class="trap-badge">⚠ High-yield trap question</div>':'';
  document.getElementById('vig').innerHTML='<strong>Clinical scenario:</strong> '+q.vig;
  document.getElementById('qobj').textContent='Objective: '+q.lo;
  document.getElementById('qt').textContent=q.q||'';
  const oel=document.getElementById('opts');
  oel.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+o;
    b.onclick=()=>answerQ(i,q.ok,q.expl,q.kp,oel);
    oel.appendChild(b);
  });
  document.getElementById('expl').style.display='none';
}
function answerQ(chosen,ok,expl,kp,oel){
  if(qAnswered)return;
  qAnswered=true;qTotal++;
  oel.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===ok)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
  });
  if(chosen===ok)qScore++;
  document.getElementById('qs').textContent='Score: '+qScore+' / '+qTotal;
  const kpHTML=kp?'<div class="key-pts"><strong>Key points:</strong> '+kp.map(p=>'<br>· '+p).join('')+'</div>':'';
  const ep=document.getElementById('expl');
  ep.innerHTML=expl+kpHTML;
  ep.style.display='block';
}
loadQ();
