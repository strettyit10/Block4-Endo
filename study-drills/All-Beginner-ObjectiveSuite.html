const SG_DATA=[
{title:'Intro to Hormone Action (Danielsen)',tags:['t-bio'],content:`<ul>
<li><strong>4 hormone classes:</strong> peptides (stored in granules, fast), amino acid derivatives (catecholamines = fast/membrane; TH = nuclear), steroids (lipophilic, nuclear, not stored), eicosanoids.</li>
<li><strong>Receptor types:</strong> membrane (GPCR, enzyme-linked, ion channel) = rapid (seconds-minutes); nuclear (steroid/TH/retinoic acid superfamily) = slow (hours). Both undergo signal amplification.</li>
<li><strong>Steroid/TH nuclear receptor superfamily:</strong> ligand-binding + zinc-finger DNA-binding domain. TR unique: represses TRE without T3; activates with T3. nTRE: opposite.</li>
<li><strong>Carrier proteins:</strong> only free hormone is active. Estrogen → ↑TBG → ↑total T4 but normal free T4 (NOT hyperthyroid). CBG carries cortisol/progesterone. TeBG carries testosterone/estradiol.</li>
<li><span class="trap">Trap: elevated total TH in pregnancy is NOT hyperthyroidism. Always check free T4.</span></li>
<li><strong>Catecholamine synthesis:</strong> Tyr → (TH, rate-limiting) → DOPA → DA → NE → (PNMT, requires glucocorticoids) → Epi. PNMT only in adrenal medulla (portal cortisol exposure).</li>
</ul>`},
{title:'Hypothalamic-Pituitary Relationships (Watson)',tags:['t-phys'],content:`<ul>
<li><strong>Anterior pituitary cell types (FLAT PiG):</strong> Somatotrophs (GH, 50%), Corticotrophs (ACTH), Thyrotrophs (TSH), Gonadotrophs (LH/FSH), Lactotrophs (Prolactin).</li>
<li><strong>Hypothalamic hormones:</strong> TRH→TSH+PRL; CRH→ACTH; GHRH→GH; SS→GH+TSH(−); GnRH→LH+FSH; DA→PRL(−).</li>
<li><strong>3 feedback levels:</strong> Long (terminal hormone → Hyp+Pit), Short (pituitary → Hyp), Ultrashort (hypothalamic → self; sets pulsatile rhythm).</li>
<li><strong>Portal blood blockage:</strong> all anterior hormones fall EXCEPT prolactin RISES (removes dopamine inhibition). Any stalk compression = ↑prolactin.</li>
<li><span class="trap">Trap: stalk compression gives mildly elevated prolactin (usually &lt;150 ng/mL). True prolactinoma macroadenoma → &gt;200-500 ng/mL.</span></li>
<li><strong>Target gland ablation:</strong> removes long-loop feedback → both hypothalamic AND pituitary trophic hormones rise. Used clinically (thyroidectomy → ↑TSH for I-131 scanning).</li>
</ul>`},
{title:'Posterior Pituitary (Sherman)',tags:['t-phys','t-pharm'],content:`<ul>
<li><strong>AVP + OT:</strong> made in hypothalamic magnocellular neurons (SON, PVN), released from posterior pituitary. NOT synthesized in posterior pituitary.</li>
<li><strong>AVP receptors:</strong> V1a (Gq, smooth muscle, vasoconstriction) · V1b (Gq, pituitary corticotrophs, potentiates ACTH) · V2 (Gs, renal collecting duct, AQP2 insertion → water reabsorption).</li>
<li><strong>Osmotic threshold:</strong> AVP secretion begins ~280 mOsm/kg. Thirst begins ~290 (anticipatory behavioral response). Cold oropharyngeal receptors inhibit AVP before osmolality changes.</li>
<li><strong>DI types:</strong> Central (can't make AVP → DDAVP concentrates urine). Nephrogenic (V2R/AQP2 defect → DDAVP fails). Gestational (placental vasopressinase → DDAVP works).</li>
<li><strong>DDAVP advantages:</strong> V2-selective (no V1a vasoconstriction), longer half-life, vasopressinase-resistant, nasal/oral route.</li>
<li><span class="trap">Trap: DDAVP response differentiates central (works) from nephrogenic (fails). Primary polydipsia: concentrated urine on water deprivation, no DDAVP needed.</span></li>
<li><strong>Oxytocin:</strong> uterine OTR upregulated by estrogen at term → explains why OTR antagonists can't stop labor. Suckling reflex → OT → myoepithelial contraction → milk ejection. OT+AVP in pair bonding (V1a receptor in limbic system).</li>
</ul>`},
{title:'GH Axis (Watson)',tags:['t-phys','t-path'],content:`<ul>
<li><strong>Regulation:</strong> GHRH (arcuate nucleus) stimulates; SS (periventricular) inhibits; ghrelin also stimulates. Dual regulation allows large pulsatile peaks.</li>
<li><strong>GH physiology:</strong> protein anabolic (muscle, bone) but DIABETOGENIC (insulin resistance in muscle/adipose, gluconeogenesis, lipolysis). IGF-1 from liver = long-loop feedback (−GHRH, +SS).</li>
<li><strong>IGF-1:</strong> best marker for chronic GH secretion (stable, no pulsatility). GH is pulsatile — random GH levels unreliable.</li>
<li><strong>Stimulators:</strong> hypoglycemia, fasting, exercise, deep sleep, amino acids, estrogen. Inhibitors: hyperglycemia, obesity (FFA), hypercortisolemia, IGF-1.</li>
<li><strong>Acromegaly:</strong> GH macroadenoma, after growth plate closure → acral enlargement, not height. Oral glucose suppression test (GH should suppress to &lt;1) = gold standard. DM in 25-30%.</li>
<li><span class="trap">Trap: random GH is meaningless for diagnosis. Obesity suppresses GH — provocative testing needed for deficiency. ITT (hypoglycemia) = most potent stimulus.</span></li>
<li><strong>Mass effects:</strong> bitemporal hemianopsia = chiasm compression from nasal retinal fiber damage. Microadenoma &lt;1cm, macroadenoma ≥1cm.</li>
</ul>`},
{title:'Thyroid & Parathyroid (Danielsen, Watson, Wieneke)',tags:['t-phys','t-path','t-pharm'],content:`<ul>
<li><strong>TH synthesis:</strong> NIS → TPO (oxidation/organification) → coupling → proteolysis → release. TSH stimulates all steps. Wolff-Chaikoff: iodine excess transiently blocks organification (escape in 1-2 weeks by NIS downregulation).</li>
<li><strong>Drug targets:</strong> PTU = blocks TPO + T4→T3 conversion (preferred thyroid storm, 1st trimester). Methimazole = blocks TPO only. Perchlorate = NIS inhibitor.</li>
<li><strong>T3 vs T4:</strong> T4 is prohormone (most secreted). T3 is active (10x higher TR affinity). T4→T3 by 5'-deiodinase in periphery. TR binds TRE without T3 (represses); with T3 (activates).</li>
<li><strong>Graves' disease:</strong> TSI (IgG) activates TSH-R → hyperthyroid + goiter + exophthalmos (orbital fibroblasts also express TSH-R → activated → GAG deposition → proptosis). Treat I-131/PTU/surgery.</li>
<li><strong>Hashimoto's:</strong> anti-Tg + anti-TPO → lymphocytic infiltration → hypothyroid. Most common cause US. May have transient thyrotoxicosis early (hashitoxicosis).</li>
<li><span class="trap">Trap: TSH is most sensitive thyroid test (falls before T4 rises in hyperthyroid; rises before T4 falls in hypothyroid). Subclinical disease = TSH abnormal, T4 still normal range.</span></li>
<li><strong>Thyroid cancers:</strong> Papillary (Orphan Annie nuclei, psammoma bodies, lymphatic spread, BRAF) · Follicular (capsular/vascular invasion on histology, NOT FNA; hematogenous) · Medullary (C-cells, calcitonin, MEN2, RET) · Anaplastic (worst) · Lymphoma (Hashimoto's).</li>
<li><strong>Parathyroid:</strong> Primary HPT (high PTH, high Ca, low PO4, adenoma 80%). Secondary (CKD: high PTH, low Ca, high PO4). Tertiary (autonomous: high PTH, high Ca → parathyroidectomy).</li>
</ul>`},
{title:'HPA Axis (Watson, Danielsen)',tags:['t-phys','t-path'],content:`<ul>
<li><strong>Cortisol control:</strong> CRH + AVP → ACTH → cortisol. 3-level feedback. Diurnal rhythm: peak 6-8 AM, nadir midnight (SCN-driven). Stress (pain, surgery, hypoglycemia) activates axis.</li>
<li><strong>Cortisol metabolic effects — low (physiological):</strong> maintains overnight blood glucose (gluconeogenesis). <strong>High (pathological):</strong> central fat redistribution, peripheral muscle wasting (protein catabolism), poor wound healing, insulin resistance, immunosuppression (inhibits arachidonic acid pathway, T-cell cytokines). Liver: gluconeogenesis + protein synthesis (exception to catabolic rule).</li>
<li><strong>Cushing's differentiation:</strong> Exogenous → ACTH suppressed. Cushing's Disease (pituitary, 60-70%) → ACTH elevated, high-dose dexa SUPPRESSES. Adrenal adenoma (10-20%) → ACTH suppressed. Ectopic (10-20%) → very high ACTH, does NOT suppress.</li>
<li><strong>Addison's disease:</strong> autoimmune (75%), &gt;90% cortex destroyed. Low cortisol + low aldosterone + HIGH ACTH → hyperpigmentation (POMC/MSH), hypoNa, hyperK, hypoglycemia, hypotension. Cortrosyn test: blunted cortisol response.</li>
<li><span class="trap">Trap: chronic exogenous steroids → HPA suppression → adrenal atrophy → cannot respond to stress → give stress-dose steroids perioperatively. Never abruptly stop chronic steroids.</span></li>
<li><strong>CAH:</strong> 21-OHD (90-95%) = salt-wasting + virilization, 17-OHP elevated. 11β-OHD (5-8%) = HTN + virilization, NO salt-wasting. 17α-OHD = HTN + NO sex steroids, XY→female phenotype.</li>
</ul>`},
{title:'Adrenal Synthesis (Danielsen)',tags:['t-bio','t-phys'],content:`<ul>
<li><strong>Zone–hormone map:</strong> Glomerulosa → Aldosterone (CYP11B2, Ang II + K+ regulated, no CYP17A1). Fasciculata → Cortisol (CYP17A1 + CYP21A2 + CYP11B1, ACTH regulated). Reticularis → DHEA/DHEA-S (CYP17A1 lyase, ACTH regulated).</li>
<li><strong>Rate-limiting step:</strong> StAR protein (cholesterol → inner mitochondrial membrane). StAR deficiency = lipoid CAH = NO steroids from adrenal OR gonads.</li>
<li><strong>11β-HSD2:</strong> converts cortisol → inactive cortisone in aldosterone target tissues → protects MR from cortisol (which has equal MR affinity). Inhibition (licorice/glycyrrhizin) → apparent mineralocorticoid excess.</li>
<li><strong>Adrenal androgens:</strong> DHEA-S is major product (long t½ via albumin binding). Peaks mid-20s, starts age 6-8 (adrenarche). Important for female body hair/libido.</li>
<li><span class="trap">Trap: glomerulosa has NO CYP17A1 → cannot make cortisol or sex steroids → aldosterone ONLY. ACTH does not primarily regulate aldosterone (Ang II + K+ do).</span></li>
</ul>`},
{title:'Adrenal Pathology (Wieneke) & Pharmacology (Sharma)',tags:['t-path','t-pharm'],content:`<ul>
<li><strong>CAH enzyme summary:</strong> 21-OHD: low cortisol + low aldo + high androgens → salt-wasting + virilization, 17-OHP↑ (diagnostic). 11β-OHD: low cortisol + DOC↑ (mineralocorticoid) → HTN + virilization, no salt-wasting. 17α-OHD: low cortisol + low sex steroids + DOC↑ → HTN, XY female.</li>
<li><strong>Waterhouse-Friderichsen:</strong> Neisseria meningitidis septicemia → DIC → bilateral adrenal hemorrhage → acute adrenal crisis. Emergency: glucocorticoids + antibiotics.</li>
<li><strong>Pheochromocytoma:</strong> Rule of 10s (10% bilateral, extra-adrenal, malignant, pediatric, familial). Diagnose: urine/plasma metanephrines. Treat: ALPHA FIRST (phenoxybenzamine 10-14d), THEN beta-blocker. Beta first = hypertensive crisis (unopposed alpha).</li>
<li><strong>Primary hyperaldosteronism:</strong> High aldo + LOW renin (autonomous). HTN + hypokalemia. Conn's = aldosterone adenoma (35%). Bilateral hyperplasia (60%). Screen with aldosterone:renin ratio &gt;30.</li>
<li><strong>Adrenal pharmacology:</strong> Cortrosyn test (ACTH stimulation, normal cortisol peak &gt;18-20 µg/dL). Metyrapone (CYP11B1 block → ↑11-deoxycortisol + ↑ACTH in normal/Cushing's Disease; no rise in adrenal adenoma). Dexamethasone suppression (low dose = normals; high dose = Cushing's Disease vs ectopic). Synthesis blockers: ketoconazole, osilodrostat, metyrapone, mitotane. Replacement: hydrocortisone + fludrocortisone.</li>
<li><span class="trap">Trap: secondary hyperaldosteronism = HIGH renin + high aldo (RAAS activated by low perfusion). Primary = LOW renin + high aldo (autonomous, suppresses RAAS).</span></li>
</ul>`},
{title:'Pituitary Pathology (Santi)',tags:['t-path'],content:`<ul>
<li><strong>PitNET/adenoma classification:</strong> by immunohistochemistry (hormone staining). Most common: prolactinoma. GH → acromegaly/gigantism. ACTH → Cushing's Disease. TSH → hyperthyroidism. Non-functioning → mass effects only.</li>
<li><strong>Prolactinoma:</strong> most common functioning adenoma. Treat with dopamine agonists (cabergoline) — first-line even for macroadenoma (shrinks tumor). Surgery if resistant.</li>
<li><strong>Stalk compression trap:</strong> any large sellar mass → mildly elevated prolactin (&lt;150 ng/mL) from removing dopamine. True prolactinoma macroadenoma → usually &gt;200-500 ng/mL. Treating a non-prolactinoma with DA agonist = no shrinkage, missed diagnosis.</li>
<li><strong>Hypopituitarism causes:</strong> Sheehan's (postpartum hemorrhage → ischemia; first sign = failure of lactation). Trauma. Tumors. Radiation. Infiltrative (sarcoid, hemochromatosis).</li>
<li><strong>Bitemporal hemianopsia:</strong> mass → suprasellar extension → compresses optic chiasm → nasal retinal fibers (crossing) damaged → temporal vision lost.</li>
<li><strong>Empty sella:</strong> primary = usually incidental, normal pituitary function. Secondary (post-surgery/radiation) = may have hypopituitarism.</li>
</ul>`},
{title:'Diabetes Mellitus (Furlong, Janicic)',tags:['t-path','t-pharm'],content:`<ul>
<li><strong>T1DM:</strong> autoimmune beta-cell destruction (T-cell mediated, anti-GAD/IA2/insulin antibodies), absolute insulin deficiency, C-peptide absent. Onset typically youth but any age. DKA = hallmark complication.</li>
<li><strong>T2DM:</strong> insulin resistance + progressive relative beta-cell failure. ~50% beta-cells lost at diagnosis. First phase insulin secretion lost early. Multifactorial: genetics + obesity + lifestyle.</li>
<li><strong>Diagnosis:</strong> FBG ≥126, OGTT 2h ≥200, HbA1c ≥6.5%, random glucose ≥200+symptoms. Pre-diabetes: FBG 100-125, OGTT 140-199.</li>
<li><strong>DKA vs HHS:</strong> DKA = T1DM/insulin deficiency → lipolysis → ketones → anion gap metabolic acidosis. HHS = T2DM/relative deficiency → no ketones (residual insulin blocks ketogenesis) → extreme hyperglycemia, hyperosmolarity, coma.</li>
<li><span class="trap">Trap: DKA K+ is HIGH (serum) despite total body K+ depletion (acidosis + insulin deficiency shifts K+ out of cells). Insulin → K+ re-enters cells → serum K+ drops rapidly. Replete K+ before starting insulin if K+ &lt;3.5.</span></li>
<li><strong>Drug mechanisms:</strong> Metformin: AMPK → ↓hepatic gluconeogenesis, no hypoglycemia, avoid in CKD &lt;30. Sulfonylureas: close K-ATP → insulin release regardless of glucose → hypoglycemia risk. GLP-1 agonists: glucose-DEPENDENT insulin release → no solo hypoglycemia + weight loss + CV benefit. SGLT2i: glucosuria → weight loss + BP + HF + CKD benefit. DPP-4i: ↑endogenous GLP-1, weight neutral, CV neutral. TZDs: PPARγ → insulin sensitizer, avoid HF (fluid retention).</li>
<li><strong>Complications:</strong> Microvascular (nephropathy → ESRD #1 cause; retinopathy → blindness #1 adult cause; neuropathy). Macrovascular (CVD, stroke, PAD, non-traumatic amputation #1 cause). Pathways: AGEs, polyol, PKC, oxidative stress.</li>
</ul>`},
];

function buildSG(){
  let html='';
  SG_DATA.forEach((s,i)=>{
    const tags=s.tags.map(t=>`<span class="lo-tag ${t}">${t.replace('t-','')}</span>`).join('');
    html+=`<div class="sg-h" onclick="tSG(${i})">${s.title} ${tags}<span id="sa${i}">▾</span></div><div class="sg-b" id="sb${i}">${s.content}</div>`;
  });
  document.getElementById('sg-body').innerHTML=html;
}
function tSG(i){const b=document.getElementById('sb'+i),a=document.getElementById('sa'+i);b.classList.toggle('open');a.textContent=b.classList.contains('open')?'▴':'▾';}
buildSG();

function showTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tnb').forEach(b=>b.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  btn.classList.add('active');
}
</script>
