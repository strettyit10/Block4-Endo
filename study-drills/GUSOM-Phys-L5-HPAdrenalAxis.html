const flashcards=[
{q:"Name the 3 adrenal cortex layers and their products. Mnemonic?",a:"Outer → Zona Glomerulosa → Mineralocorticoids (aldosterone)\nMiddle → Zona Fasciculata → Glucocorticoids (cortisol)\nInner → Zona Reticularis → Androgens (DHEA, androstenedione)\nMnemonic: 'GFR = Salt, Sugar, Sex' (outer to inner)"},
{q:"What is POMC and what are its cleavage products?",a:"POMC = proopiomelanocortin (prohormone in corticotropes of anterior pituitary). Cleavage products: ACTH (39 aa), MSH (13 aa — fully contained within ACTH sequence), β-endorphin, β-lipotropin. All co-released when ACTH is released."},
{q:"What regulates aldosterone secretion? What does NOT regulate it?",a:"PRIMARY regulators: Angiotensin II (RAAS) and extracellular K⁺ (hyperkalemia directly stimulates glomerulosa).\nACTH: permissive only (maintains enzyme expression; does NOT trigger aldosterone release).\nCortisol: does NOT regulate aldosterone release (11β-HSD2 converts cortisol to inactive cortisone in kidney to prevent cortisol from activating MR)."},
{q:"Describe all major metabolic actions of cortisol.",a:"↑Glycogenolysis; ↑gluconeogenesis (liver); ↑protein catabolism (muscle → AA substrate); ↑lipolysis (adipose); Induces insulin resistance in muscle/adipose → hyperglycemia. Liver: ↑AA uptake, ↑protein synthesis, ↑plasma protein secretion. Net: raises blood glucose, spares glucose for brain/muscles."},
{q:"What are the immune/anti-inflammatory effects of cortisol?",a:"↓Arachidonic acid pathway (→ ↓prostaglandins, leukotrienes)\n↓T-cell cytokine release (↓IL-2, interferon)\n↓Antibody production (sustained cortisol)\n↓Fibroblast activity → ↓collagen/ECM\nPermissive: adrenal insufficiency → ↑eosinophils (no cortisol suppression)"},
{q:"What is the role of 11β-HSD2 in mineralocorticoid specificity?",a:"11β-HSD2 (hydroxysteroid dehydrogenase type 2): expressed in aldosterone-sensitive tissues (kidney collecting duct, colon, salivary glands). Converts active CORTISOL → inactive CORTISONE. This prevents cortisol from flooding and activating MRs (since cortisol has nearly equal affinity for MR and GR). Without 11β-HSD2 (deficiency or inhibition by licorice/glycyrrhizin) → cortisol activates MR → hypertension + hypokalemia."},
{q:"Cushing's disease vs Cushing's syndrome: what's the difference? ACTH levels?",a:"Cushing's DISEASE: ACTH-secreting pituitary adenoma → ↑ACTH → ↑cortisol + hyperpigmentation (excess ACTH cleaved to MSH).\nCushing's SYNDROME: Excess cortisol from ANY cause. If adrenal tumor: ↓ACTH (cortisol feeds back → suppresses CRH/ACTH). If ectopic ACTH (small cell lung cancer): ↑↑ACTH.\nAll share the same cortisol excess signs (moon face, buffalo hump, striae, osteoporosis, DM, HTN)."},
{q:"Classic findings of Addison's disease and mechanism of each.",a:"↓Cortisol → fatigue, hypoglycemia, hypotension, ↑eosinophils (loss of immunosuppression)\n↓Aldosterone → hyponatremia, hyperkalemia, salt craving, ↓BP\n↓Androgens → ↓pubic/axillary hair (in women especially)\n↑ACTH (loss of long-loop feedback) → ↑MSH → hyperpigmentation (bronze tan, mucous membranes)\nCause: autoimmune (#1), TB/infection"},
{q:"What is the cortisol circadian rhythm and why does it matter?",a:"Cortisol peaks at WAKING (~6-8 AM) and declines throughout the day. Pre-waking rise driven by ↑CRH (SCN-mediated) → ↑ACTH → ↑cortisol → glucose mobilized from glycogen (after overnight fast). Lowest levels in early sleep. Clinical: exogenous steroid given at night → maximal suppression of HPA axis (suppresses the morning CRH surge). Cushing's screening: midnight salivary cortisol (should be near zero; elevated = Cushing's)."},
{q:"What is the permissive effect of cortisol on adrenergic receptors?",a:"Cortisol upregulates adrenergic receptor expression in vascular smooth muscle and other tissues. Without cortisol (adrenal insufficiency), vasopressors (NE, EPI) have markedly REDUCED efficacy → refractory hypotension. This is why adrenal crisis requires immediate hydrocortisone (not just fluids/vasopressors). Physiological cortisol is permissive for normal hemodynamic response to catecholamines."},
{q:"What enzyme is deficient in classic CAH, and what accumulates as a result?",a:"21-hydroxylase (CYP21A2) deficiency — the most common CAH (95% of cases).\nBlocked reaction: 17-hydroxyprogesterone (17-OHP) → 11-deoxycortisol (→ cortisol path) AND progesterone → deoxycorticosterone (→ aldosterone path).\nResult: ↓Cortisol + ↓Aldosterone → ↑↑ACTH (no feedback) → adrenal hyperplasia + shunting of precursors to androgens (DHEA, androstenedione → testosterone).\nDiagnostic marker: ↑↑ 17-hydroxyprogesterone (17-OHP) on newborn screen or serum."},
{q:"Describe the classic neonatal presentation of salt-wasting CAH.",a:"Salt-wasting CAH (21-hydroxylase deficiency, 75% of classic cases):\n↓Aldosterone → Na⁺ wasted, K⁺ retained → hyponatremia + hyperkalemia\n↓Cortisol → hypoglycemia + stress intolerance\n↑Androgens → ambiguous genitalia in 46,XX females (virilization: clitoral enlargement, labial fusion)\nPresents at 1–2 weeks of life with: vomiting, dehydration, shock, ↓Na⁺, ↑K⁺\nMale neonates: appear normal at birth → crisis first presentation (no virilization sign)\nTreatment: hydrocortisone (replaces cortisol, suppresses ACTH) + fludrocortisone (replaces aldosterone)"},
{q:"How do you distinguish CAH from Addison's disease on labs?",a:"BOTH: ↑ACTH + ↓cortisol + ↓aldosterone + hypoNa + hyperK\nKEY DIFFERENCES:\nCAH: ↑↑ 17-OHP (builds up behind enzyme block) — NOT elevated in Addison's\nCAH: ↑Androgens (DHEA, testosterone) → virilization in females, precocious puberty\nCAH: Adrenal glands are HYPERPLASTIC (excess ACTH + androgenic precursors)\nAddison's: ↓Androgens (adrenal cortex destroyed); ↓ 17-OHP or normal\nAddison's: Adrenal glands are ATROPHIC (autoimmune destruction)\nAge: CAH presents in neonates/infants; Addison's typically adults"},
];

const mcqs=[
{stem:"A 45-year-old woman develops easy bruisability, central obesity with thin extremities, purple striae on her abdomen, and a rounded 'moon face.' Her serum cortisol is elevated. Dexamethasone suppression testing shows <strong>low-dose dex does NOT suppress cortisol</strong>, but high-dose dex DOES suppress cortisol. What is the most likely diagnosis?",
options:["Primary adrenal tumor secreting cortisol autonomously","Ectopic ACTH-producing tumor (small cell lung cancer)","Cushing's disease (ACTH-secreting pituitary adenoma)","Exogenous steroid use","Addison's disease"],
correct:2,
explanations:["Adrenal tumor: ACTH would be suppressed (cortisol feeds back → pituitary shuts down ACTH). AND high-dose dex would NOT suppress (tumor is autonomous). Low-dose doesn't suppress in any Cushing's type (low-dose dex screens for Cushing's — anything that is Cushing's fails to suppress with low-dose).","Ectopic ACTH (e.g., small cell lung cancer): ACTH is VERY high, cortisol very high. NEITHER low nor high dose dex suppresses (ectopic tumor doesn't have pituitary dex receptor feedback). Doesn't fit — high-dose dex suppresses here.","CORRECT. Cushing's DISEASE (pituitary adenoma): The pituitary tumor still has some feedback response, just at a higher threshold. High-dose dex (8 mg) can still suppress the pituitary tumor's ACTH secretion. Low-dose (1 mg) does NOT suppress (shifted set point). Hallmark: suppresses with HIGH-dose dex but NOT low-dose.","Exogenous steroids: ACTH would be suppressed (exogenous steroid provides long-loop feedback → pituitary shuts down). BOTH doses of dex would suppress (patient is receiving exogenous GC; dex would add to it but also suppress).","Addison's = hypocortisolism (opposite of this clinical picture)."],
teaching:"Dex suppression test: Overnight 1-mg test (low-dose) — screens for ANY Cushing's. Pituitary Cushing's: suppresses with 8-mg (high-dose) but not 1-mg. Adrenal Cushing's: ACTH already low; neither dose suppresses. Ectopic ACTH: neither dose suppresses (ectopic tumor insensitive to feedback)."
},
{stem:"A 32-year-old woman with known Addison's disease presents to the ER after vomiting for 2 days and unable to keep her oral hydrocortisone down. She is hypotensive (BP 78/50), and lethargic. Na⁺ 122 mEq/L, K⁺ 6.2 mEq/L. What is the mechanism of her hypotension and the MOST important immediate treatment?",
options:["Hyponatremia causing cerebral edema → CNS-mediated hypotension; treat with hypertonic saline","Low cortisol → loss of permissive effect on vascular adrenergic receptors + low aldosterone → Na⁺/H₂O loss; treat with IV hydrocortisone + normal saline","Low ACTH → myocardial dysfunction; treat with ACTH infusion","GnRH suppression causing low sex steroids → hypotension; treat with sex steroid replacement","Low MSH → vasodilation; treat with synthetic MSH"],
correct:1,
explanations:["Hypertonic saline would worsen the hyperkalemia and is not the first-line. The hypotension here is adrenal-mediated.","CORRECT. Adrenal crisis: (1) ↓Cortisol → loss of permissive effect on vascular adrenergic receptors → vasopressors don't work → refractory hypotension. (2) ↓Aldosterone → Na⁺/water wasting → hypovolemia → shock. Treatment: IV hydrocortisone (100 mg IV immediately, then 50-100 mg q6-8h) + 0.9% NS for volume resuscitation. Life-threatening emergency.","ACTH infusion wouldn't help if adrenal gland is destroyed (Addison's = primary adrenal failure).","Sex steroids don't directly mediate this acute hemodynamic crisis.","MSH doesn't regulate vascular tone in this way."],
teaching:"Adrenal crisis = medical emergency. Life-threatening: refractory hypotension + hyponatremia + hyperkalemia. Treat with IV HYDROCORTISONE (not just fluids — cortisol is needed to restore adrenergic sensitivity). Also replace volume with NS. Fludrocortisone (mineralocorticoid) added after stabilization for long-term aldosterone replacement."
},
{stem:"A patient with a large pituitary tumor has the following lab abnormalities: Low cortisol, low ACTH, low TSH, low T4, low LH, low FSH, low testosterone, low IGF-1, and elevated prolactin. What is the mechanism for the elevated prolactin?",
options:["The pituitary tumor is a prolactinoma secreting prolactin directly","Pituitary cell destruction has paradoxically stimulated lactotropes","Stalk compression by the tumor prevents dopamine from reaching the anterior pituitary","Low TRH from hypothalamic damage stimulates prolactin","Low cortisol has removed the inhibitory effect on prolactin secretion"],
correct:2,
explanations:["Prolactinomas do cause elevated prolactin, but a non-secreting tumor with stalk compression is the context here (all other hormones are LOW, suggesting destruction/compression, not a secreting adenoma).","Pituitary destruction would reduce prolactin production, not increase it, unless the stalk is compressed.","CORRECT. Stalk effect: the pituitary tumor compresses the infundibular stalk → dopamine (PIH) from hypothalamus cannot reach the anterior pituitary → dopaminergic inhibition of lactotropes is removed → prolactin rises. All other hormones fall (lose their releasing hormones). Classic: non-functioning pituitary adenoma + elevated prolactin = stalk effect, not prolactinoma.","Low TRH would REDUCE prolactin (TRH stimulates both TSH and PRL).","Low cortisol doesn't directly cause elevated prolactin."],
teaching:"Pan-hypopituitarism + elevated prolactin = stalk effect from non-functioning adenoma. Distinguish from prolactinoma (which gives isolated prolactin elevation). Treatment differs: prolactinoma → dopamine agonist (cabergoline/bromocriptine); non-functioning adenoma with stalk effect → resect the mass."
},
{stem:"A patient develops hypertension and severe hypokalemia. Serum aldosterone is undetectable. Serum cortisol is elevated. She is on no medications. She has been eating large amounts of black licorice daily. What is the mechanism?",
options:["Black licorice contains synthetic aldosterone that activates MR directly","Glycyrrhizin in licorice inhibits 11β-HSD2 → cortisol activates mineralocorticoid receptors","Licorice stimulates the adrenal zona glomerulosa to produce excess aldosterone","Licorice contains phytoestrogens that activate MR via estrogen receptor crosstalk","Licorice blocks GR, diverting cortisol to exclusively activate MR"],
correct:1,
explanations:["Black licorice does not contain synthetic aldosterone.","CORRECT. Glycyrrhizin (active compound in natural black licorice) is a potent INHIBITOR of 11β-HSD2 → cortisol is NOT converted to inactive cortisone in kidney/aldosterone-sensitive tissues → cortisol accumulates and activates MINERALOCORTICOID RECEPTORS (MR) → sodium retention, potassium excretion → hypertension + hypokalemia. Aldosterone is LOW (suppressed by high 'effective mineralocorticoid' activity feedback).","Aldosterone is LOW — the glomerulosa is not overproducing it.","Phytoestrogens do not explain MR activation in this manner.","GR blockade would cause cortisol to accumulate, but the MR pathway still requires 11β-HSD2 to be present."],
teaching:"11β-HSD2 is the 'gatekeeper' protecting MR from cortisol. Block 11β-HSD2 → cortisol becomes a mineralocorticoid → HTN + hypokalemia + LOW aldosterone. Same mechanism: apparent mineralocorticoid excess syndrome (genetic 11β-HSD2 deficiency), carbenoxolone, excessive licorice ingestion."
},
{stem:"A patient with septic shock on vasopressors is not responding to norepinephrine or phenylephrine at high doses. Serum cortisol is found to be low. What is the physiological basis for the refractory hypotension?",
options:["Low cortisol causes bradycardia, reducing cardiac output","Low cortisol directly causes vasodilation through cGMP pathway","Without cortisol, the permissive upregulation of vascular adrenergic receptor expression is lost → vasopressors have reduced efficacy","Low cortisol causes ACTH to rise, which then blocks adrenergic receptors","Cortisol deficiency causes severe acidosis, impairing catecholamine binding"],
correct:2,
explanations:["Cortisol deficiency can cause mild bradycardia indirectly, but primary mechanism is vascular resistance.","Cortisol doesn't primarily act via cGMP for its hemodynamic effects.","CORRECT. Cortisol upregulates adrenergic receptor expression (α1, β1) in vascular smooth muscle and heart — a permissive effect. Without cortisol → ↓adrenergic receptors → vasopressors (NE, phenylephrine) cannot work effectively → refractory hypotension. This is why stress-dose hydrocortisone is given in vasopressor-dependent septic shock when adrenal insufficiency is suspected.","ACTH does not block adrenergic receptors.","Acidosis can impair catecholamine effects, but the primary mechanism here is receptor downregulation."],
teaching:"Cortisol's permissive effect on hemodynamics: crucial in critical illness. 'Relative adrenal insufficiency of critical illness' — patients who don't mount adequate cortisol response may need 'stress-dose steroids' (hydrocortisone 200-300 mg/day IV). This is controversial but supported by evidence in vasopressor-dependent septic shock."
},
{stem:"A 28-year-old woman who has taken prednisone 40 mg daily for 6 months for Crohn's disease is abruptly stopping the medication without tapering. Which complication should she be warned about?",
options:["Addisonian crisis from HPA axis suppression","Immediate Cushing's syndrome symptoms appearing","Rebound hypercortisolism from overactivated adrenal glands","Autoimmune adrenalitis triggered by steroid withdrawal","Permanent destruction of corticotropes requiring lifelong replacement"],
correct:0,
explanations:["CORRECT. Long-term exogenous glucocorticoids → suppress CRH and ACTH via long-loop feedback → adrenal glands atrophy (no ACTH stimulation) → sudden stoppage = adrenal glands can't produce cortisol fast enough → Addisonian crisis risk: hypotension, nausea, fatigue, electrolyte abnormalities. Must TAPER steroids slowly to allow HPA recovery.","Cushing's symptoms were present DURING steroid use. After stopping, they would resolve, not appear.","Adrenal glands have been suppressed/atrophied, not hyperactivated.","Autoimmune adrenalitis is a cause of PRIMARY adrenal insufficiency — not a withdrawal effect.","Corticotrope suppression is usually REVERSIBLE with slow taper, but recovery takes months. Permanent destruction is rare."],
teaching:"HPA suppression from exogenous steroids: rule of thumb — any patient taking >20 mg prednisone/day for >3 weeks likely has HPA suppression. NEVER stop abruptly. Taper slowly (speed depends on duration/dose). Patients need 'sick day rules' — double their steroid dose if ill (unable to mount stress cortisol response)."
},
{stem:"Which of the following is a direct effect of ACTH on the adrenal cortex?",
options:["ACTH directly triggers aldosterone release from zona glomerulosa","ACTH stimulates cholesterol uptake and conversion to pregnenolone in zona fasciculata cells","ACTH binds to mineralocorticoid receptors to promote sodium retention","ACTH directly stimulates epinephrine release from the adrenal medulla","ACTH inhibits cortisol synthesis to prevent excess glucocorticoid production"],
correct:1,
explanations:["ACTH is permissive for mineralocorticoid synthesis but does NOT directly trigger aldosterone release. Aldosterone is triggered by Ang II and hyperkalemia.","CORRECT. ACTH binds MC2R on zona fasciculata cells → Gs → cAMP → PKA → (1) StAR protein expression (moves cholesterol into mitochondria) + (2) upregulates steroidogenic enzymes → cholesterol converted to pregnenolone → subsequent enzymatic steps → cortisol.","ACTH binds MC2R (not MR). MR binds aldosterone and cortisol.","ACTH acts on the cortex, not the medulla. The medulla is regulated by sympathetic preganglionic neurons.","ACTH STIMULATES cortisol synthesis — it's the main driver."],
teaching:"ACTH → zona fasciculata → StAR protein (mitochondrial cholesterol transport) + enzyme upregulation → pregnenolone → cortisol. The rate-limiting step in steroidogenesis is cholesterol transport into the mitochondria (via StAR). ACTH controls this."
},
{stem:"A medical student is reviewing cortisol actions for her Step 1 exam. She correctly identifies that cortisol affects bone. Which of the following best describes cortisol's effect on bone?",
options:["↑ Osteoblast activity → ↑ bone formation → increased bone density","↓ Osteoblast activity + ↑ osteoclast signaling + ↑ renal Ca²⁺ excretion → osteoporosis","↑ Calcium absorption from GI tract → hypercalcemia → bone resorption","Cortisol has no significant effect on bone; only PTH and calcitriol regulate bone","↓ Osteoclast activity → decreased bone resorption → improved bone density"],
correct:1,
explanations:["Cortisol inhibits osteoblasts (not stimulates). The opposite is true.","CORRECT. Cortisol: (1) Directly inhibits osteoblasts → ↓bone formation, (2) Increases signals driving osteoclast activity → ↑bone resorption, (3) Decreases GI Ca²⁺ absorption (opposes calcitriol), (4) Increases renal Ca²⁺ excretion → negative calcium balance → osteoporosis. This is why chronic steroid use is a major cause of secondary osteoporosis.","Cortisol DECREASES GI Ca²⁺ absorption (by opposing calcitriol action in gut). Opposite of this option.","Cortisol has major effects on bone — one of the biggest clinical problems of chronic steroid use.","Cortisol INCREASES osteoclast activity (bone resorption)."],
teaching:"Steroid-induced osteoporosis: cortisol → ↓osteoblasts + ↑osteoclasts + ↓Ca²⁺ absorption + ↑Ca²⁺ excretion → net bone loss. Patients on long-term steroids need calcium + vitamin D supplementation and possibly bisphosphonates. Bone density monitoring (DEXA scan) recommended."
},
{stem:"A 55-year-old woman with metastatic small cell lung cancer develops hyponatremia, confusion, and muscle cramps. Serum Na⁺ 115 mEq/L. Urine osmolality 650 mOsm/kg (concentrated). Serum ACTH is markedly elevated at 2,400 pg/mL. What endocrine syndrome is most consistent?",
options:["Central diabetes insipidus from brain metastases","Primary adrenal insufficiency from adrenal metastases","Ectopic ACTH syndrome from tumor → hypercortisolism → also co-secretion of ADH → SIADH-like picture","Addison's disease from autoimmune destruction","Secondary hypothyroidism from pituitary metastases"],
correct:2,
explanations:["Central DI: hypernatremia + dilute urine. This patient has hyponatremia + concentrated urine — opposite.","Primary adrenal insufficiency: ACTH would be elevated, but the tumor context and the hyponatremia pattern here suggest something else. Also, Addison's wouldn't cause this ACTH level from an adrenal source.","CORRECT. Small cell lung cancer is the #1 cause of ectopic ACTH production. Markedly elevated ACTH → severe hypercortisolism. Additionally, ectopic ACTH tumors often also secrete ADH (or the hypercortisolism itself affects Na⁺ balance) → SIADH-like picture with hyponatremia. Very high ACTH, rapid onset, metabolic alkalosis, hypokalemia, and glucose intolerance are characteristic.","Addison's = low cortisol + high ACTH, but not from a tumor secreting its own ACTH. This ACTH is ectopic.","Secondary hypothyroidism: low TSH, low T4. Not related to the finding here."],
teaching:"Ectopic ACTH syndrome: small cell lung cancer (#1), carcinoid tumors. Features: very high ACTH (often >200-300 pg/mL), rapid onset of hypercortisolism, hypokalemia (ACTH → massive cortisol → some MR binding), metabolic alkalosis. Often presents without classic Cushing's habitus (too rapid onset). Neither low-dose nor high-dose dex suppresses."
},
{stem:"A <strong>2-week-old genetic female (46,XX)</strong> presents to the ER with poor feeding, vomiting, lethargy, and shock. Parents report she had slightly unusual genitalia at birth — the pediatrician noted clitoral enlargement and partial labial fusion. Labs: Na⁺ 115 mEq/L, K⁺ 7.1 mEq/L, glucose 38 mg/dL, ACTH markedly elevated. Newborn screening flagged an elevated <strong>17-hydroxyprogesterone (17-OHP)</strong>. What is the diagnosis and underlying enzymatic defect?",
options:["Addison's disease from autoimmune adrenal destruction; adrenal cortex atrophy on imaging","Congenital adrenal hyperplasia (CAH) from 21-hydroxylase deficiency; ↓cortisol + ↓aldosterone + shunting to androgens","11β-HSD2 deficiency; excess cortisol activating mineralocorticoid receptors causing hyponatremia","Pituitary panhypopituitarism; low ACTH causing all adrenal products to be low","Ectopic ACTH syndrome; cortisol excess causing electrolyte abnormalities"],
correct:1,
explanations:["Addison's: autoimmune, typically in adults. Would not explain elevated 17-OHP or virilized genitalia. ACTH would be high, but 17-OHP would NOT be elevated (no enzyme block). Adrenals would be atrophic (destroyed), not hyperplastic.","CORRECT. 21-hydroxylase deficiency (most common CAH): CYP21A2 enzyme block → cannot convert 17-OHP to 11-deoxycortisol (→ cortisol) or progesterone to deoxycorticosterone (→ aldosterone). Result: ↓cortisol → ↑ACTH → adrenal hyperplasia + 17-OHP builds up → shunted to androgens → virilization of 46,XX fetus (clitoral enlargement, labial fusion). Salt-wasting (↓aldosterone) → hypoNa + hyperK + shock. Diagnostic marker: ↑↑ 17-OHP.","11β-HSD2 deficiency: causes apparent mineralocorticoid excess — HTN + hypokalemia (opposite electrolytes). Does not explain virilization or neonatal crisis with hyponatremia.","Panhypopituitarism: ACTH would be LOW, not elevated. All adrenal products would be low, but no virilization or 17-OHP accumulation.","Ectopic ACTH: causes Cushing's features (excess cortisol), not cortisol deficiency. Would not explain virilization or this neonatal presentation."],
teaching:"CAH red flags: (1) neonatal salt-wasting crisis (hypoNa + hyperK + shock at 1-2 weeks), (2) virilized genitalia in 46,XX infant (ambiguous genitalia), (3) ↑↑ 17-OHP on newborn screen. Diagnosis: serum 17-OHP + ACTH + cortisol. Treatment: hydrocortisone (suppresses ACTH → stops androgen excess) + fludrocortisone (replaces aldosterone). Males with CAH often missed at birth (no virilization) — present later with salt-wasting crisis."
},
{stem:"A medical student asks: 'If both CAH (21-hydroxylase deficiency) and Addison's disease have elevated ACTH and low cortisol, what single lab test would most reliably distinguish them?' Which answer is correct?",
options:["Serum aldosterone — it is elevated in CAH but low in Addison's","Serum 17-hydroxyprogesterone (17-OHP) — it is markedly elevated in CAH but NOT elevated in Addison's","Serum ACTH — CAH has higher ACTH than Addison's","Serum sodium — hyponatremia is specific to CAH, not Addison's","Cortisol response to cosyntropin (ACTH stimulation) — CAH cortisol rises, Addison's does not"],
correct:1,
explanations:["Aldosterone is LOW in BOTH classic (salt-wasting) CAH and Addison's disease. Not helpful for distinguishing them.","CORRECT. 17-hydroxyprogesterone (17-OHP) is the KEY distinguishing marker. In 21-hydroxylase deficiency CAH: 17-OHP cannot be converted to 11-deoxycortisol (enzyme blocked) → 17-OHP accumulates to very high levels. In Addison's: the adrenal cortex is destroyed, but there is no specific enzyme block → 17-OHP levels are normal or low. ↑↑ 17-OHP is PATHOGNOMONIC for 21-OH deficiency CAH.","Both conditions can have significantly elevated ACTH. This does not distinguish them.","Both Addison's and salt-wasting CAH cause hyponatremia (low aldosterone in both). Not specific.","In Addison's: adrenal cortex is destroyed → cortisol does NOT rise with cosyntropin. In CAH: adrenal cortex is HYPERPLASTIC (driven by excess ACTH) but enzymatically blocked → cortisol also does NOT rise adequately (and 17-OHP rises dramatically). This test is less specific than 17-OHP alone."],
teaching:"17-OHP is the diagnostic marker for 21-hydroxylase deficiency: The enzyme block causes 17-OHP to pile up — levels are often >10,000 ng/dL in affected neonates (normal <100 ng/dL). This is why it's on the newborn screening panel. Also useful to remember: CAH has ↑androgens + virilization; Addison's has ↓androgens (adrenal gland is destroyed, can't make any steroids). The adrenals are HYPERPLASTIC in CAH (excess ACTH stimulus) vs ATROPHIC in Addison's."
},
{stem:"Which finding distinguishes PRIMARY adrenal insufficiency (Addison's) from SECONDARY adrenal insufficiency (pituitary failure)?",
options:["Primary: normal aldosterone; Secondary: ↓ aldosterone","Primary: ↓ cortisol; Secondary: normal cortisol","Primary: ↑ ACTH + hyperpigmentation + hyperkalemia; Secondary: ↓ ACTH + no hyperpigmentation + normal K⁺","Primary: caused by autoimmune disease; Secondary: always caused by tumors","Primary: responds to ACTH stimulation test; Secondary: does not respond"],
correct:2,
explanations:["Aldosterone is regulated by Ang II/K⁺, not primarily by ACTH. In primary (Addison's), aldosterone IS low (adrenal cortex destroyed). In secondary, aldosterone may be relatively preserved (glomerulosa responds to Ang II, not ACTH primarily).","Both have low cortisol — this does not distinguish them.","CORRECT. Primary (Addison's): ACTH is HIGH (adrenal cortex destroyed → no cortisol → no negative feedback → hypothalamus/pituitary produce excess CRH/ACTH) → excess ACTH cleaved to MSH → HYPERPIGMENTATION. Also low aldosterone → HYPERKALEMIA, hyponatremia. Secondary (pituitary failure): ACTH is LOW (pituitary can't make it) → no MSH excess → NO hyperpigmentation. Aldosterone preserved → normal K⁺.","Secondary insufficiency can be from tumors, but also surgery, radiation, autoimmune hypophysitis, etc. Primary can be from causes besides autoimmune.","ACTH stimulation test: In primary, adrenal doesn't respond (destroyed). In secondary, adrenal initially may respond (gland intact, just unstimulated), then atrophies. But this choice is imprecise."],
teaching:"Key distinguishing features: Hyperpigmentation + hyperkalemia = PRIMARY (Addison's). Normal skin + normal K⁺ = SECONDARY. The reason: primary → ↑ACTH (→ MSH → pigmentation) + ↓aldosterone (→ K⁺ retention). Secondary → ↓ACTH (→ no MSH, no pigmentation) + aldosterone relatively preserved."
}
];

{banner:"Clinical Vignette | Cushing's Syndrome Workup",

const traps=[
{title:"TRAP #1: Addison's causes hyponatremia AND hypokalemia",myth:"Addison's disease (adrenal insufficiency) causes both low sodium AND low potassium because everything is 'low.'",truth:"Addison's causes LOW SODIUM but HIGH POTASSIUM. Aldosterone deficiency: sodium is WASTED (lost in urine), potassium is RETAINED (can't excrete K⁺). Hyponatremia + HYPERKALEMIA is the classic finding. Low potassium would suggest Conn's syndrome (too MUCH aldosterone)."},
{title:"TRAP #2: Cushing's disease and Cushing's syndrome are the same thing",myth:"Cushing's disease and Cushing's syndrome both describe pituitary ACTH overproduction.",truth:"Cushing's DISEASE: specifically a pituitary ACTH-secreting adenoma. Cushing's SYNDROME: any cause of excess cortisol (adrenal tumor, ectopic ACTH, exogenous steroids, Cushing's disease). Cushing's disease IS a subtype of Cushing's syndrome. The distinction matters for ACTH level interpretation and treatment."},
{title:"TRAP #3: Aldosterone is controlled primarily by ACTH",myth:"ACTH is the main regulator of aldosterone secretion from the zona glomerulosa.",truth:"Aldosterone is regulated primarily by ANGIOTENSIN II and HYPERKALEMIA (extracellular K⁺). ACTH has only a permissive role (maintains enzyme expression but does not trigger secretion). Even in panhypopituitarism (no ACTH), aldosterone function is relatively preserved because the glomerulosa responds to the RAAS."},
{title:"TRAP #4: Cortisol increases immune function (because stress = fight)",myth:"Cortisol is released during stress to boost the immune system for the battle ahead.",truth:"Acutely, cortisol has a brief pro-immune effect. But SUSTAINED cortisol is profoundly IMMUNOSUPPRESSIVE: ↓T-cell cytokines, ↓antibody production, ↓fibroblasts, ↓prostaglandins. This is why chronic stress increases infection risk and why steroids are used to treat autoimmune disease."},
{title:"TRAP #5: 11β-HSD2 activates cortisol for kidney action",myth:"11β-HSD2 activates cortisol to make it work as a mineralocorticoid in the kidney.",truth:"11β-HSD2 INACTIVATES cortisol (converts it to cortisone) in the kidney. This PREVENTS cortisol from flooding MRs. Without 11β-HSD2, cortisol would cause aldosterone-like effects (HTN + hypokalemia). This enzyme protects mineralocorticoid specificity for aldosterone."},
{title:"TRAP #6: CAH and Addison's are indistinguishable because both have ↑ACTH and ↓cortisol",myth:"CAH and Addison's disease both show elevated ACTH with low cortisol, so they are essentially the same disease with the same workup.",truth:"CAH and Addison's share ↑ACTH + ↓cortisol, but are fundamentally DIFFERENT. Key distinctions: (1) 17-OHP is MARKEDLY ELEVATED in CAH (enzyme block causes 17-OHP to pile up) — it is NOT elevated in Addison's. (2) Androgens are HIGH in CAH (shunting of precursors) — they are LOW in Addison's (adrenal gland destroyed). (3) Adrenals are HYPERPLASTIC in CAH (excess ACTH drives growth) — ATROPHIC in Addison's (autoimmune destruction). (4) CAH presents in NEONATES (virilized genitalia, salt-wasting crisis) — Addison's typically in ADULTS. The single best distinguishing lab is serum 17-OHP."},
];
